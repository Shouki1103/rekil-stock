<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="横断検索">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>横断検索</title>
<style>:root{--bg:#14181d;--surface:#1d232a;--line:#2f3740;--fg:#e8ebee;--muted:#9aa4af;--accent:#f2a541;--steel:#0d1014;--danger:#ff5d4d;--ok:#5fcf7a;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg);color:var(--fg);margin:0}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{flex:0 0 auto;background:var(--steel);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;white-space:nowrap}
.brand i{display:inline-block;width:12px;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#1d2228 5px 10px);border-radius:2px}
.hb{font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.tabs{flex:0 0 auto;display:flex;gap:6px;padding:8px max(14px,calc((100% - 640px)/2)) 0;overflow-x:auto}
.tabs button{flex:1 0 auto;font:inherit;font-size:14px;font-weight:700;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0 12px}
.tabs button.on{background:var(--accent);color:#14181d;border-color:var(--accent)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px max(14px,calc((100% - 640px)/2)) calc(90px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card h2{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:700}
h3{font-size:13px;color:var(--muted);margin:16px 2px 8px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14px;font-weight:600}.row .t small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.tag.a{color:#14181d;background:var(--accent);border-color:var(--accent)}.tag.r{color:#fff;background:var(--danger);border-color:var(--danger)}.tag.g{color:#14181d;background:var(--ok);border-color:var(--ok)}
.btn{font:inherit;font-size:14px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;cursor:pointer}
.btn.p{background:var(--accent);color:#14181d;border-color:var(--accent);font-weight:700}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 12px}
textarea{min-height:90px}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.chips button{font:inherit;font-size:13px;min-height:32px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0 12px}.chips button.on{background:var(--accent);color:#14181d;border-color:var(--accent)}
.muted{color:var(--muted);font-size:12px}.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
.sheet{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheet .box{background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:min(640px,100%);max-height:90%;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:90}.toast.show{opacity:1}
a{color:var(--accent)}
</style>
</head>
<body>
<script>/* rekil-common */</script>
<header><div class="brand"><i></i>横断検索</div><div></div></header>

<main>

<input id="q" type="search" placeholder="管理番号・ブランド名・商品名で探す" autocomplete="off" autofocus>
<p class="muted" id="st" style="margin:6px 2px"></p>
<div id="res"></div>

</main>
<script>
const APP_VERSION = "2026-11-26-1";

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(_){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} } };
const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const W = "日月火水木金土";
const md = d => { const x = new Date(d+"T00:00:00Z"); return `${x.getUTCMonth()+1}/${x.getUTCDate()}(${W[x.getUTCDay()]})`; };
const yen = n => (Math.round(+n||0)).toLocaleString("ja-JP") + "円";
function toast(t){ let el = $("#toast"); if(!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); } el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1800); }
const getPass = (...keys) => { try{ for(const k of [...keys,"rekil-pass"]){ const v = localStorage.getItem(k); if(v) return v; } }catch(_){} return ""; };
async function gas(url, body){ const r = await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)}); const j = await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j; }
async function getJSON(path){ const r = await fetch(path+"?v="+Date.now(), {cache:"no-store"}); return r.json(); }
function tabs(key, def, onChange){ let cur = ls.get(key, def); const set = () => { $$("[data-tab]").forEach(b=>b.classList.toggle("on", b.dataset.tab===cur)); $$("[data-view]").forEach(v=>v.hidden = v.dataset.view!==cur); onChange && onChange(cur); };
  document.addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if(!b) return; cur = b.dataset.tab; ls.set(key, cur); set(); }); set(); return () => cur; }
async function checkUpdate(){ try{ const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}); const t=await r.text(); const m=t.match(/const APP_VERSION = "([^"]+)"/); if(m && m[1]!==APP_VERSION) location.replace(location.pathname+"?v="+encodeURIComponent(m[1])); }catch(_){} }
if(location.protocol.startsWith("http")){ checkUpdate(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); }); }


const G = id => `https://script.google.com/macros/s/${id}/exec`;
/* 検索するアプリ（データ側のURL・暗証番号のキー・開くページ） */
const SRC = [
 {k:"zaiko", n:"在庫/売上", u:G("AKfycbzOhUEYHb8aw2YofUdx1o9v19HzFqHBSP0cN4nfcHpvaBJX51z36H4HavxHMD37NZVcLQ"), p:"rekil-zaiko-pass", open:"../zaiko/",
   rows: j => (j.result||[]).map(r=>({t:`${r[0]} ${r[1]}`, s:[r[6], r[3] && "仕入 "+r[3], r[4] && String(r[4]).slice(0,10), r[9] && "販売 "+r[9]].filter(Boolean).join("・"), q:`${r[0]} ${r[1]} ${r[3]} ${r[5]} ${r[9]}`}))},
 {k:"stock", n:"ReKiL Stock（棚）", u:G("AKfycbzwTUZUpd0aYiLI5TuDZIOhoCMeDIqYnCm-82wXHCvs23T10T_d3noiPD1T9Bl_63X64w"), p:"rekil-pass", open:"../"},
 {k:"saisun", n:"採寸帳", u:G("AKfycbymxFtpBAd8KiZMjoAyHEl8Tz8GQRjaVLlpAZfm3KGTeOa4Ifz4IHGjO_PZpiTJfx31"), p:"rekil-saisun-pass", open:"../saisun/"},
 {k:"mercari", n:"メルカリ再出品", u:G("AKfycbzc7ND5p6X7nAyZ5AImSXScpj59BJQUo9Ht1SlBvO5Km6wNUIW7eG3iQfpghGJJq3Mk"), p:"rekil-mercari-pass", open:"../mercari/"},
 {k:"henpin", n:"出品・返品・外注", u:G("AKfycbzuakHA841y3KMQTn32E6L6UOebKO9LZGEqX1IHAAQ3Xkb5Y2tvp4ZlIOVnr1u9T5KD"), p:"rekil-henpin-pass", open:"../henpin/"},
 {k:"irai", n:"eBay出品依頼", u:G("AKfycbyt_sbyLWtGgD8TODNx7kvs2gEOlisN6X8XWqFYGyVQVHkmqvrIRTo6RWZXgYSPjRCB"), p:"rekil-irai-pass", open:"../irai/"},
 {k:"haiki", n:"廃棄記録", u:G("AKfycbxkxy7ZrqL9cnVaCq6ROX0OMRfYMeDVoYT7C_U-H1D2ENsS3nax-hfNFT7dDMOsItiHTQ"), p:"rekil-haiki-pass", open:"../haiki/"},
 {k:"okurijo", n:"送り状控え", u:G("AKfycbwa-V3TqAAmz3S1-zreAI3Jkp0d4f0aGikswIQnTdmxsgFpggUxE0bjl1-sR0DZumSwsQ"), p:"rekil-okuri-pass", open:"../okurijo/"},
 {k:"uriage", n:"売上入力", u:G("AKfycby_jyb7iNU30-66PBZz1tePhqZDMFmtik2SY48w2lqBxRPTJ38Xiwyxn1i9DQPTvILs"), p:"rekil-uriage-pass", open:"../uriage/"},
 {k:"shitami", n:"下見・指値", u:G("AKfycbw7kz9QQt6CMQvwIC4IhtSekntc4xGCUAWuop6U7LO_3U6FMRo--X6wKI0F6hSx3n3Vng"), p:"rekil-shitami-pass", open:"../shitami/"},
];
const SKIP = /^(id|at|created|updated|createdAt|updatedAt|photo|photos|img|image|thumb|pass|seq|done|doneAt)$/i;
/* 形の分からないデータは、中の「項目のまとまり」を全部拾って検索する */
function flatten(j){ const out = []; const walk = (v, depth) => { if(depth>4 || v==null) return;
  if(Array.isArray(v)){ v.forEach(x=>{ if(x && typeof x==="object" && !Array.isArray(x)) out.push(x); else walk(x, depth+1); }); return; }
  if(typeof v==="object") Object.values(v).forEach(x=>walk(x, depth+1)); }; walk(j, 0);
  return out.map(o=>{ const vals = Object.entries(o).filter(([k,v])=>!SKIP.test(k) && (typeof v==="string"||typeof v==="number") && String(v).length && String(v).length<200 && !/^data:|^https?:/.test(String(v)));
    const pick = ["no","code","kanri","mgmt","name","title","item","brand","tracking","auction","product"]; const main = vals.filter(([k])=>pick.some(p=>k.toLowerCase().includes(p))).map(([,v])=>v);
    return {t:(main.length?main:vals.map(([,v])=>v)).slice(0,2).join(" "), s:vals.map(([,v])=>v).filter(v=>!main.includes(v)).slice(0,4).join("・"), q:vals.map(([,v])=>v).join(" ")}; }); }
const norm = s => String(s||"").normalize("NFKC").toLowerCase().replace(/[\s\-ー‐_・]/g,"");
const DATA = {}; let status = {};
async function load(s){
  const c = ls.get("srch-"+s.k, null); if(c) DATA[s.k] = c;
  const pass = getPass(s.p); if(!pass){ status[s.k] = "暗証番号なし"; return; }
  try{ const j = await gas(s.u, {action:"list", pass}); DATA[s.k] = (s.rows ? s.rows(j) : flatten(j)).filter(r=>r.t); ls.set("srch-"+s.k, DATA[s.k]); status[s.k] = "ok"; }
  catch(e){ status[s.k] = e.message==="passcode" ? "暗証番号が違う" : "通信できず"; }
}
function render(){
  const q = norm($("#q").value); const ok = SRC.filter(s=>DATA[s.k]).length, bad = SRC.filter(s=>status[s.k] && status[s.k]!=="ok");
  $("#st").textContent = `${ok}/${SRC.length}アプリのデータを検索` + (bad.length ? `（読めなかった：${bad.map(s=>s.n+"＝"+status[s.k]).join("、")}）` : "");
  if(q.length<2){ $("#res").innerHTML = '<div class="empty">2文字以上入れてください</div>'; return; }
  const words = $("#q").value.normalize("NFKC").split(/\s+/).map(norm).filter(Boolean);
  let total = 0;
  $("#res").innerHTML = SRC.map(s=>{ const hit = (DATA[s.k]||[]).filter(r=>{ const n = norm(r.q+" "+r.t); return words.every(w=>n.includes(w)); }); total += hit.length; if(!hit.length) return "";
    return `<div class="card"><h2>${esc(s.n)}（${hit.length}件） <a href="${s.open}" style="font-weight:400">開く ›</a></h2>${hit.slice(0,30).map(r=>`<a class="row" style="text-decoration:none;color:inherit" href="${s.open}"><span class="t"><b>${esc(r.t)}</b>${r.s?`<small>${esc(r.s)}</small>`:""}</span></a>`).join("")}${hit.length>30?`<p class="muted">ほか${hit.length-30}件</p>`:""}</div>`; }).join("") || '<div class="empty">見つかりませんでした</div>';
}
let tm; $("#q").oninput = () => { clearTimeout(tm); tm = setTimeout(render, 150); };
const q0 = new URLSearchParams(location.search).get("q"); if(q0) $("#q").value = q0;
SRC.forEach(s=>{ const c = ls.get("srch-"+s.k, null); if(c) DATA[s.k] = c; }); render();
Promise.all(SRC.map(s=>load(s).then(render)));

</script>
<script>/* 共通：電波がなくても開ける・ホームへ戻るボタン */if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{});try{if(sessionStorage.getItem("rekil-from-home")&&!/\/home\/?$/.test(location.pathname)){const b=document.createElement("a");b.href="../home/";b.textContent="⌂";b.setAttribute("aria-label","ReKiLホームへ");b.style.cssText="position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;width:44px;height:44px;border-radius:22px;background:#2a313a;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 16px #0008;opacity:.9";document.body.appendChild(b)}}catch(_){}</script>
</body>
</html>
