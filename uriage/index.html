<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="売上入力">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ReKiL 売上入力</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#14181d; --surface:#1d232a; --ink:#e8ebee; --muted:#9aa4af; --line:#2f3740;
  --acc:#5aa9ff; --acc-ink:#06182b; --ok:#3fd18b; --warn:#f2c230; --chip:#262d35; --steel:#0d1014;
  --f-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sync{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--f-num);white-space:nowrap}
.stripe{height:6px;margin-top:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--acc) 0 8px,#16283d 8px 16px)}
@media (max-width:480px){.brand .hint{display:none}}
.status{font-size:12px;color:var(--muted);margin:8px 0 0;min-height:1em}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input[type=search]{font-size:16px}
textarea{resize:vertical;font-size:16px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.sum .todo b{color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.thumb{width:64px;height:64px;border-radius:6px;background:var(--chip);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:11px;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;font-family:var(--f-num);font-size:11px;border-radius:4px;padding:0 4px}
.item .body{min-width:0}
.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reason{font-size:13px;color:var(--ink);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.need{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-block;font-size:11px;background:var(--chip);border-radius:4px;padding:0 6px}
.tag.miss{background:#16283d;color:var(--acc)}
.tag.gone{background:#3a3214;color:var(--warn)}
.arrow{color:var(--muted);font-size:20px}
.sect{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-weight:700;font-size:14px;color:var(--muted)}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
button.sect{appearance:none;border:0;background:none;width:100%;font-family:inherit;cursor:pointer;padding:6px 0;text-align:left}
.caret{font-size:10px;transition:transform .15s}
.sect[aria-expanded="true"] .caret{transform:rotate(90deg)}
.count{font-family:var(--f-num);font-size:12px;background:var(--chip);border-radius:10px;padding:0 8px}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.hint{font-size:12px;color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94%;overflow:auto;border-radius:14px 14px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.info{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.info dt{color:var(--muted)} .info dd{margin:0;font-family:var(--f-num);word-break:break-all}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .del{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:0;background:#000b;color:#fff;font-size:16px;cursor:pointer;line-height:1}
.ph .new{position:absolute;left:4px;bottom:4px;font-size:10px;background:var(--acc);color:var(--acc-ink);border-radius:4px;padding:0 5px;font-weight:700}
.add{aspect-ratio:1;border:1px dashed var(--muted);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;gap:2px}
.add b{font-size:26px;line-height:1;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.viewer{position:fixed;inset:0;z-index:30;background:#000e;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.viewer .nav{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:12px;align-items:center;color:#fff;font-family:var(--f-num)}
.viewer .nav button{position:static}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:40;max-width:90vw}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#lock h2{margin:0;font-size:20px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style><style>
.who{display:flex;gap:6px;margin-top:10px;align-items:center;font-size:12px;color:var(--muted)}
.who .chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.tag.k{background:#16283d;color:var(--acc)}
.tag.mer{background:#3a1f1c;color:#ff9b8f}
.tag.late{background:#3a3214;color:var(--warn)}
.memo{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:14px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.btns .btn{padding:12px 14px}
.btn.ask{background:#3a3214;color:var(--warn);border-color:#5a4c1c}
.item{grid-template-columns:1fr auto}
.sum div{cursor:default}
.sum .ask b{color:var(--warn)}
</style>
</head>
<body>
<script>/* rekil-common */try{const K="rekil-uriage-pass",P=localStorage.getItem("rekil-pass");if(P&&!localStorage.getItem(K))localStorage.setItem(K,P)}catch(_){}</script>

<div class="wrap">
  <header>
    <div class="brand"><h1>売上入力</h1><span class="hint">オークション・メルカリの売上入力の進み具合</span><span class="sync" id="sync"></span></div>
    <div class="stripe" aria-hidden="true"></div>
    <div class="sum">
      <div class="todo"><b id="n-todo">0</b><span>俊輔の入力待ち</span></div>
      <div class="ask"><b id="n-ask">0</b><span>祥貴の確認待ち</span></div>
      <div><b id="n-done">0</b><span>今月の済み</span></div>
    </div>
    <div class="who">使う人：<button class="chip" data-who="俊輔">俊輔</button><button class="chip" data-who="祥貴">祥貴</button></div>
  </header>
  <p class="status" id="status">読み込み中…</p>

  <div id="sec-ask"><div class="sect">祥貴の確認待ち <span class="count" id="c-ask">0</span></div><div class="list" id="ask"></div></div>
  <div id="sec-todo"><div class="sect">俊輔の入力待ち <span class="count" id="c-todo">0</span></div>
    <p class="hint" style="margin:-4px 0 10px">オークションは開催日の翌日、メルカリは毎日前日分が自動で出ます。全部入力できたら「済み」、分からない商品があればメモして祥貴へ渡してください。</p>
    <div class="list" id="todo"></div></div>
  <button class="sect" id="done-toggle" aria-expanded="false" aria-controls="done"><span class="caret" aria-hidden="true">▶</span>済み <span class="count" id="c-done">0</span></button>
  <div class="list" id="done" hidden></div>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>
<div id="lock" hidden><form id="lockForm">
  <h2>売上入力</h2>
  <p class="hint" id="lockMsg">社内の暗証番号を入力してください（ReKiL Stockと同じ番号）。一度入力すると、この端末では次から入力不要です。</p>
  <input id="passIn" type="password" inputmode="numeric" autocomplete="current-password" aria-label="暗証番号">
  <button class="btn primary" id="lockGo">開く</button>
</form></div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ▼ Apps Script をデプロイしたときの「ウェブアプリのURL」 */
const API_URL = "https://script.google.com/macros/s/AKfycby_jyb7iNU30-66PBZz1tePhqZDMFmtik2SY48w2lqBxRPTJ38Xiwyxn1i9DQPTvILs/exec";
const APP_VERSION = "2026-11-22-2";
const CACHE = "uriage-data";
const ST = {todo:"俊輔の入力待ち", ask:"祥貴の確認待ち", done:"済み"};
let tasks = [];
let pass = ""; try{ pass = localStorage.getItem("rekil-uriage-pass") || localStorage.getItem("rekil-pass") || ""; }catch(_){}
let who = "俊輔"; try{ who = localStorage.getItem("uriage-who") || "俊輔"; }catch(_){}
try{ const c = JSON.parse(localStorage.getItem(CACHE)||"null"); if(c) tasks = c.tasks||[]; }catch(_){}
let busy = 0, online = false;
class ApiError extends Error{ constructor(c){ super(c); this.code = c; } }
function keep(){ try{ localStorage.setItem(CACHE, JSON.stringify({tasks})); }catch(_){} }
function sync(){ const el=$("#sync"); if(el) el.textContent = (!API_URL?"未設定":busy?"保存中…":online?"接続済み":"未接続")+"  ver "+APP_VERSION.slice(5); }
async function api(action, params={}){
  if(!API_URL) throw new ApiError("no_api");
  busy++; sync();
  try{
    let res;
    try{ res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action, pass, by: who, ...params})}); }
    catch(_){ throw new ApiError("network"); }
    let j; try{ j = await res.json(); }catch(_){ throw new ApiError("bad_response"); }
    if(!j.ok){ if(j.error==="passcode") showLock(); throw new ApiError(j.error||"error"); }
    if(j.data){ tasks = j.data.tasks||[]; keep(); draw(); }
    online = true; return j.result;
  }finally{ busy--; sync(); }
}
function toast(msg){ const r=$("#toast-root"); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",2200); }
function setStatus(t){ $("#status").textContent=t; }

const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const WD = "日月火水木金土";
const md = d => d ? `${+d.slice(5,7)}/${+d.slice(8,10)}(${WD[new Date(d+"T12:00:00Z").getUTCDay()]})` : "";
const ago = d => Math.round((Date.parse(today()+"T00:00:00Z") - Date.parse(d+"T00:00:00Z"))/864e5);
const title = t => t.kind==="メルカリ" ? `${md(t.date)} メルカリ販売分` : `${md(t.date)} ${t.site}`;
const when = ms => ms ? new Date(ms).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";

function card(t){
  const tags = [`<span class="tag ${t.kind==="メルカリ"?"mer":"k"}">${esc(t.kind==="メルカリ"?"メルカリ":"オークション")}</span>`];
  if(t.status!==ST.done){ const a = t.status===ST.ask ? Math.round((Date.now()-(t.askedAt||Date.now()))/864e5) : ago(t.date)-(t.kind==="メルカリ"?0:1);
    if(a>=3) tags.push(`<span class="tag late">${a}日経過</span>`); }
  if(t.status===ST.done && t.doneAt) tags.push(`<span class="tag">済み ${esc(when(t.doneAt))}</span>`);
  return `<button class="item" data-id="${esc(t.id)}">
    <span class="body">
      <span class="name" style="display:block">${esc(title(t))}</span>
      <span class="need">${tags.join("")}</span>
      ${t.unknown?`<span class="reason" style="display:block">分からない：${esc(t.unknown.replace(/\n/g," / "))}</span>`:""}
      ${t.note?`<span class="meta" style="display:block">${esc(t.note)}</span>`:""}
    </span><span class="arrow" aria-hidden="true">›</span></button>`;
}
function draw(){
  const asc = (a,b)=>a.date.localeCompare(b.date)||a.site.localeCompare(b.site), desc=(a,b)=>(b.doneAt||0)-(a.doneAt||0)||b.date.localeCompare(a.date);
  const todo = tasks.filter(t=>t.status===ST.todo).sort(asc), ask = tasks.filter(t=>t.status===ST.ask).sort(asc), done = tasks.filter(t=>t.status===ST.done).sort(desc);
  const ym = today().slice(0,7);
  $("#n-todo").textContent=todo.length; $("#n-ask").textContent=ask.length;
  $("#n-done").textContent=done.filter(t=>new Date((t.doneAt||0)+9*3600e3).toISOString().slice(0,7)===ym).length;
  $("#c-todo").textContent=todo.length; $("#c-ask").textContent=ask.length; $("#c-done").textContent=done.length;
  $("#todo").innerHTML = todo.length ? todo.map(card).join("") : `<div class="empty">入力待ちはありません</div>`;
  $("#ask").innerHTML = ask.length ? ask.map(card).join("") : `<div class="empty">確認待ちはありません</div>`;
  $("#done").innerHTML = done.length ? done.slice(0,100).map(card).join("") : `<div class="empty">まだありません</div>`;
  /* 祥貴が使うときは確認待ちを上に、俊輔のときは入力待ちを上に */
  const w=$(".wrap"), sa=$("#sec-ask"), st=$("#sec-todo");
  if(who==="祥貴") w.insertBefore(sa, st); else w.insertBefore(st, sa);
  document.querySelectorAll(".who .chip").forEach(b=>b.classList.toggle("on", b.dataset.who===who));
}
document.addEventListener("click", e=>{ const b=e.target.closest(".item"); if(!b) return; const t=tasks.find(x=>x.id===b.dataset.id); if(t) openTask(t); });
document.querySelectorAll(".who .chip").forEach(b=>b.onclick=()=>{ who=b.dataset.who; try{ localStorage.setItem("uriage-who", who); }catch(_){} draw(); });
function setDoneOpen(open){ $("#done-toggle").setAttribute("aria-expanded", open); $("#done").hidden=!open; }
$("#done-toggle").onclick = ()=>setDoneOpen($("#done").hidden);

function closeSheet(){ $("#sheet-root").innerHTML=""; }
function openTask(t){
  const isTodo=t.status===ST.todo, isAsk=t.status===ST.ask;
  let html = `<h2><span>${esc(title(t))}</span><button class="btn sm" id="close">閉じる</button></h2>
    <dl class="info"><dt>状態</dt><dd>${esc(t.status)}</dd><dt>種類</dt><dd>${esc(t.kind)}</dd>
      ${t.note?`<dt>出品メモ</dt><dd>${esc(t.note)}</dd>`:""}
      ${t.askedAt?`<dt>祥貴へ渡した</dt><dd>${esc(when(t.askedAt))}</dd>`:""}
      ${t.doneAt?`<dt>済み</dt><dd>${esc(when(t.doneAt))}${t.by?"（"+esc(t.by)+"）":""}</dd>`:""}</dl>
    <div class="field"><label for="unk">分からない商品（商品名・番号・金額など）</label>
      <textarea id="unk" rows="5" placeholder="例：No.12 黒のバッグ 15,000円（管理番号の記載なし）">${esc(t.unknown||"")}</textarea></div>`;
  if(!isTodo) html += `<div class="field"><label for="rep">祥貴の対応メモ</label><textarea id="rep" rows="3" placeholder="例：No.12 は3695のPRADAで入力済み">${esc(t.reply||"")}</textarea></div>`;
  html += `<div class="btns">` + (isTodo
      ? `<button class="btn primary" data-to="done">全部入力できた（済みにする）</button><button class="btn ask" data-to="ask">分からない分を祥貴へ渡す</button><button class="btn sm" data-to="memo">メモだけ保存</button>`
      : isAsk ? `<button class="btn primary" data-to="done">確認して入力した（済みにする）</button><button class="btn sm" data-to="todo">俊輔に戻す</button><button class="btn sm" data-to="memo">メモだけ保存</button>`
      : `<button class="btn sm" data-to="memo">メモだけ保存</button><button class="btn sm" data-to="todo">入力待ちに戻す</button>`) + `</div>`;
  if(isTodo) html += `<p class="hint">「祥貴へ渡す」と、rekil.usedclothing@gmail.com にメールでお知らせが届きます。</p>`;
  $("#sheet-root").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#close").onclick=closeSheet;
  $("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeSheet(); });
  $(".btns").addEventListener("click", async e=>{
    const to=e.target.dataset.to; if(!to) return;
    if(!API_URL){ toast("データ側がまだ設定されていません"); return; }
    const unknown=$("#unk").value.trim(), reply=$("#rep")?$("#rep").value.trim():(t.reply||"");
    if(to==="ask" && !unknown){ toast("分からない商品をメモに書いてください"); $("#unk").focus(); return; }
    const status = to==="memo" ? t.status : ST[to];
    const btns=[...document.querySelectorAll(".btns .btn")]; btns.forEach(b=>b.disabled=true); e.target.textContent="保存中…";
    try{
      await api("save", {task:{id:t.id, kind:t.kind, date:t.date, site:t.site, status, unknown, reply}});
      closeSheet();
      toast(to==="ask" ? "祥貴へ渡しました（メールでお知らせしました）" : to==="done" ? "済みにしました" : to==="todo" ? "入力待ちに戻しました" : "保存しました");
    }catch(err){ btns.forEach(b=>b.disabled=false); openTask(Object.assign({}, t, {unknown, reply}));
      toast(err.code==="network" ? "通信できず保存できませんでした。もう一度押してください" : `保存できませんでした（${err.code||"error"}）`); }
  });
}

/* ---------- 暗証番号 ---------- */
function showLock(){
  online=false; $("#lock").hidden=false;
  $("#lockMsg").textContent = pass ? "暗証番号が違います。もう一度入力してください。" : "社内の暗証番号を入力してください（ReKiL Stockと同じ番号）。一度入力すると、この端末では次から入力不要です。";
  setTimeout(()=>$("#passIn").focus(),100);
}
$("#lockForm").addEventListener("submit", async e=>{
  e.preventDefault(); pass=$("#passIn").value.trim(); if(!pass) return;
  $("#lockGo").disabled=true; $("#lockGo").textContent="確認中…";
  try{ await api("list"); try{ localStorage.setItem("rekil-uriage-pass", pass); }catch(_){} $("#lock").hidden=true; $("#passIn").value=""; toast("接続しました"); setStatus(""); }
  catch(err){ if(err.code==="network") $("#lockMsg").textContent="データ側に接続できませんでした。電波を確認してください。";
    else if(err.code!=="passcode") $("#lockMsg").textContent=`データ側でエラーが起きました（${err.code}）`; }
  $("#lockGo").disabled=false; $("#lockGo").textContent="開く";
});

/* ---------- 同期・更新 ---------- */
async function refresh(){ if(!pass||busy||!API_URL||$("#sheet-root").innerHTML) return;
  try{ await api("list"); setStatus(""); }catch(err){ if(err.code==="network"){ online=false; sync(); setStatus("通信できません。表示は前回のデータです。"); } else if(err.code!=="passcode") setStatus(`読み込めませんでした（${err.code}）`); } }
async function checkUpdate(){ try{
  const r = await fetch(location.pathname+"?v="+Date.now(), {cache:"no-store"}); const t = await r.text();
  const m = t.match(/const APP_VERSION = "([^"]+)"/);
  if(m && m[1]!==APP_VERSION && (busy || $("#sheet-root").innerHTML)){ setTimeout(checkUpdate,3000); return; }
  if(m && m[1]!==APP_VERSION) location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));
}catch(_){} }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ checkUpdate(); refresh(); } });
setInterval(()=>{ if(document.visibilityState==="visible") refresh(); }, 60000);

draw(); sync();
if(!API_URL) setStatus("データ側（Apps Script）の設定待ちです。設定が終わると使えるようになります。");
else if(!pass){ setStatus(""); showLock(); }
else { setStatus(tasks.length ? "" : "読み込み中…"); checkUpdate(); refresh(); }
})();
</script>
