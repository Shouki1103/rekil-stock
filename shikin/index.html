<style>
:root{--bg:#14181d;--surface:#1d232a;--line:#2f3740;--fg:#e8ebee;--muted:#9aa4af;--accent:#4fc99a;--steel:#0d1014;--danger:#ff7a6b;--warn:#f2b441;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);padding:10px 14px 10px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}
.brand i{display:inline-block;width:12px;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#1d2228 5px 10px);border-radius:2px}
.brand small{font-size:11px;color:var(--muted);font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.sync{color:var(--muted);background:none;border:0;font:inherit;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:700}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:10px 14px}
h3{font-size:13px;color:var(--muted);margin:16px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.sum b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.sum span{font-size:11px;color:var(--muted)}
.al{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:14px;background:#262d35}
.al.l2{background:#3a2222;color:#ffd1cb}.al.l1{background:#3a3020;color:#ffe3ad}.al.l0{color:var(--muted)}
.al em{font-style:normal;margin-left:auto;white-space:nowrap;font-weight:800}
.acc .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.bd{font-size:12px;border-radius:999px;padding:1px 10px;font-weight:800;white-space:nowrap}
.bd.OK{background:#1f3b31;color:var(--accent)}.bd.注意{background:#47391d;color:var(--warn)}.bd.不足{background:#4a2420;color:var(--danger)}.bd.未入力{background:#2a313a;color:var(--muted)}
.bal{font-size:24px;font-weight:900;margin:4px 0 0;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted)}.meta .old{color:var(--warn);font-weight:700}
.row{display:flex;gap:8px;margin-top:8px}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:8px 12px;min-height:40px}
.btn.main{background:var(--accent);border:0;color:#0d1014}
.need{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:8px;background:#3a2222;color:#ffd1cb}.need.w{background:#3a3020;color:#ffe3ad}
.ev{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.ev td{padding:5px 2px;border-top:1px solid var(--line)}.ev td.r{text-align:right;white-space:nowrap}.ev .m{color:var(--danger)}.ev .p{color:var(--accent)}.ev .neg{color:var(--danger);font-weight:800}
.tag{font-size:10px;border:1px solid var(--warn);color:var(--warn);border-radius:5px;padding:0 4px;margin-left:4px;white-space:nowrap}
.tag.k{border-color:var(--line);color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}.item .d{width:44px;text-align:center;font-weight:800;font-size:13px;color:var(--muted);line-height:1.2}
.item .d small{display:block;font-size:10px;font-weight:600}.item .x{flex:1;min-width:0}.item .x div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .x small{color:var(--muted);font-size:12px}.item .a{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.item .a small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));min-height:52px;border-radius:14px;border:0;background:var(--accent);color:#0d1014;font:inherit;font-weight:800;font-size:16px}
.sheet{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet form{background:var(--surface);width:100%;max-width:600px;max-height:calc(100vh - env(safe-area-inset-top,0px) - 16px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h4{margin:0;font-size:16px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
.sheet input,.sheet select,.sheet textarea{font:inherit;font-size:16px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.sheet input[type=checkbox]{width:22px;height:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin:0}
.btns{display:flex;gap:8px}.btns button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-weight:700}
.btns .main{background:var(--accent);color:#0d1014;border:0}.btns .del{color:var(--danger)}
.qk{display:flex;flex-wrap:wrap;gap:6px}.qk button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#lock input{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
#lock button{font:inherit;font-weight:800;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#111}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f2f4f6;color:#111;padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand"><i></i>資金繰り<small>代表専用</small></div><button class="sync" id="sync" type="button"></button></div>
  <div class="tabs" id="tabs"><button data-t="acc" class="on">口座</button><button data-t="cal">予定表</button><button data-t="reg">登録</button></div>
</header>
<main id="main"></main>
<button class="fab" id="fab" type="button" hidden>＋ 引き落とし・入金を登録</button>
<div class="sheet" id="sheet" hidden><form id="form" autocomplete="off"></form></div>
<div id="lock" hidden><form id="lockForm"><h3 style="color:var(--fg);font-size:18px;margin:0">代表専用</h3><p id="lockMsg" style="color:var(--muted);font-size:13px">資金繰り専用の暗証番号を入力してください。</p><input id="passIn" type="password" inputmode="numeric" placeholder="暗証番号"><button type="submit">開く</button></form></div>
<div class="toast" id="toast"></div>
<script>
/* ===== 資金繰りの計算（アプリと Apps Script で同じもの） ===== */
const HOL = new Set(["2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
"2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22","2027-04-29","2027-05-03","2027-05-04","2027-05-05","2027-07-19","2027-08-11","2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23",
"2028-01-01","2028-01-10","2028-02-11","2028-02-23","2028-03-20","2028-04-29","2028-05-03","2028-05-04","2028-05-05","2028-07-17","2028-08-11","2028-09-18","2028-09-22","2028-10-09","2028-11-03","2028-11-23"]);
const KINDS = ["融資返済","クレカ","税金・社保","固定費","給与","入金","その他"];
const D1 = 864e5;
function fYmd(d){ return new Date(d).toISOString().slice(0,10); }
function pD(s){ return new Date(String(s).slice(0,10)+"T00:00:00Z"); }
function lastDay(y,m){ return new Date(Date.UTC(y,m,0)).getUTCDate(); } /* m=1〜12 */
function isBiz(d){ const w=d.getUTCDay(); if(w===0||w===6) return false; const s=fYmd(d); if(HOL.has(s)) return false; const md=s.slice(5); return !["12-31","01-01","01-02","01-03"].includes(md); }
function shiftBiz(d, mode){ if(mode==="none") return d; const st = mode==="prev" ? -1 : 1; let x=d; let n=0; while(!isBiz(x) && n++<15) x=new Date(x.getTime()+st*D1); return x; }
function addYm(ym, k){ let y=+ym.slice(0,4), m=+ym.slice(5,7)+k; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); }
function horizonOf(today, months){ const ym=addYm(today.slice(0,7), +months||1); return ym+"-"+String(lastDay(+ym.slice(0,4),+ym.slice(5,7))).padStart(2,"0"); }
/* 予定 → from〜to の発生日リスト */
function occurrences(plans, ovr, from, to){
  const out=[];
  (plans||[]).forEach(p=>{
    const push=(date, ym)=>{
      if(date<from || date>to) return;
      const o=(ovr||{})[p.id+"|"+ym]||{};
      const has = o.amount!==undefined && o.amount!=="" && o.amount!==null;
      const amt = Math.abs(+(has ? o.amount : p.amount) || 0);
      out.push({id:p.id+"|"+ym, plan:p.id, name:p.name, kind:p.kind, acct:p.acct, date, ym, amount:amt, sign: p.kind==="入金" ? 1 : -1,
        done: !!(+o.done), est: !!(+p.vary) && !has});
    };
    if(p.freq==="1回"){ if(p.date) push(String(p.date).slice(0,10), String(p.date).slice(0,7)); return; }
    let ym=addYm(from.slice(0,7),-1); const endYm=to.slice(0,7);
    for(let g=0; ym<=endYm && g<40; g++, ym=addYm(ym,1)){
      if(p.freq==="毎年" && +p.month!==+ym.slice(5,7)) continue;
      if(p.start && ym<p.start) continue; if(p.end && ym>p.end) continue;
      const y=+ym.slice(0,4), m=+ym.slice(5,7), L=lastDay(y,m);
      const day = (p.day==="末"||!p.day) ? L : Math.min(+p.day||1, L);
      push(fYmd(shiftBiz(new Date(Date.UTC(y,m-1,day)), p.shift||"next")), ym);
    }
  });
  return out.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1: a.sign-b.sign);
}
/* 口座ごとに見込み残高を計算 */
function forecast(data, today){
  const st=data.settings||{}, to=horizonOf(today, st.months||1), stale=+st.staleDays||7;
  const accounts=(data.accounts||[]).map(a=>{
    const has = a.balance!=="" && a.balance!==null && a.balance!==undefined && !isNaN(+a.balance);
    const base = has && a.updated ? String(a.updated).slice(0,10) : "";
    const from = base || today;
    const ev = occurrences((data.plans||[]).filter(p=>p.acct===a.id), data.ovr, from, to).filter(e=>!e.done);
    let run = has ? +a.balance : 0, min = run, neg=null, lowHit=null; const lowv = +a.low||0;
    ev.forEach(e=>{ run += e.sign*e.amount; e.after = run; if(run<min) min=run;
      if(has && run<0 && !neg) neg={date:e.date, name:e.name, need:-run};
      if(has && run<lowv && !lowHit) lowHit={date:e.date, name:e.name, need:lowv-run}; });
    if(has && neg) neg.need = -min;  /* 期間中で一番足りない額 */
    if(has && lowHit) lowHit.need = lowv-min;
    const age = base ? Math.round((pD(today)-pD(base))/D1) : null;
    const status = !has ? "未入力" : neg ? "不足" : lowHit ? "注意" : "OK";
    return {...a, has, base, events:ev, end:run, min, neg, lowHit, age, stale: has && age>stale, status,
      out: ev.filter(e=>e.sign<0).reduce((s,e)=>s+e.amount,0), inn: ev.filter(e=>e.sign>0).reduce((s,e)=>s+e.amount,0),
      est: ev.filter(e=>e.est)};
  });
  return {to, accounts};
}
/* ホーム・メール用の要約 */
function alerts(fc, data){
  const yen=n=>Math.round(n).toLocaleString("ja-JP"), md=s=>(+s.slice(5,7))+"/"+(+s.slice(8,10));
  const cur=a=>a.cur==="USD"?"$":"", out=[];
  fc.accounts.forEach(a=>{
    if(a.status==="不足") out.push({lv:2, t:`${a.name}：${md(a.neg.date)}の「${a.neg.name}」で残高不足`, v:`${cur(a)}${yen(a.neg.need)}足りない`});
    else if(a.status==="注意") out.push({lv:1, t:`${a.name}：${md(a.lowHit.date)}以降、下限を下回る`, v:`下限まで${cur(a)}${yen(a.lowHit.need)}不足`});
    if(a.status==="未入力" && (data.plans||[]).some(p=>p.acct===a.id)) out.push({lv:1, t:`${a.name}：残高が未入力`, v:"入力して"});
    else if(a.stale) out.push({lv:1, t:`${a.name}：残高が${a.age}日前のまま`, v:"更新して"});
    a.est.forEach(e=>out.push({lv:0, t:`${md(e.date)} ${e.name}：${+e.ym.slice(5)}月分の金額が未入力（目安で計算中）`, v:`目安${yen(e.amount)}`}));
  });
  return out.sort((x,y)=>y.lv-x.lv);
}
/* ▼ Apps Script をデプロイしたときの「ウェブアプリのURL」（apps-script.gs を参照） */
const API_URL = "https://script.google.com/macros/s/AKfycbwPEnxv2qxf7SGJ54_wfUQzZMecvQfv0EMmmatYxsqfmzIg1Utms_VCCayMEOSlZkWECA/exec";
const APP_VERSION = "2026-11-25-2";
const PASS_KEY = "rekil-bank-pass";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const yen = n => Math.round(+n||0).toLocaleString("ja-JP");
const md = s => (+s.slice(5,7))+"/"+(+s.slice(8,10));
const W = "日月火水木金土";
const wd = s => W[pD(s).getUTCDay()];
const cur = a => a && a.cur==="USD" ? "$" : "¥";
const mon = (c, n) => (n<0?"−":"") + c + yen(Math.abs(n));
const num = v => { const n = +String(v).replace(/[,，¥$円\s]/g,""); return isNaN(n) ? null : n; };
let pass = ""; try{ pass = localStorage.getItem(PASS_KEY) || ""; }catch(_){}
let data = {accounts:[], plans:[], ovr:{}, settings:{}}, tab = "acc", busy = 0, open = {};
try{ data = JSON.parse(localStorage.getItem("rekil-shikin-cache")) || data; }catch(_){}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1800); }
async function api(action, params={}){
  if(!API_URL){ toast("データ側の設定がまだです"); throw new Error("nourl"); }
  busy++; status();
  try{
    let res; try{ res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action, pass, ...params})}); }catch(_){ throw new Error("network"); }
    const j = await res.json();
    if(!j.ok){ if(j.error==="passcode"||j.error==="passcode_not_set") showLock(j.error); throw new Error(j.error||"error"); }
    data = j.data; try{ localStorage.setItem("rekil-shikin-cache", JSON.stringify(data)); }catch(_){}
    return j;
  }finally{ busy--; status(); render(); }
}
function status(){ $("#sync").textContent = !API_URL ? "設定待ち" : busy ? "保存中…" : "↻ 更新"; }

/* ---------- 画面 ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===tab));
  $("#fab").hidden = tab==="acc";
  const fc = forecast(data, today());
  $("#main").innerHTML = tab==="acc" ? viewAcc(fc) : tab==="cal" ? viewCal(fc) : viewReg();
}
function viewAcc(fc){
  if(!data.accounts.length) return `<div class="empty">${API_URL ? "読み込み中…" : "データ側（Apps Script）の設定待ちです。<br>設定が終わるとここに口座が出ます。"}</div>`;
  const rate = +data.settings.usdRate || 150, toY = (a,v)=> a.cur==="USD" ? v*rate : v;
  const has = fc.accounts.filter(a=>a.has);
  const tot = has.reduce((s,a)=>s+toY(a,+a.balance),0), outT = fc.accounts.reduce((s,a)=>s+toY(a,a.out),0), endT = has.reduce((s,a)=>s+toY(a,a.end),0);
  const al = alerts(fc, data);
  let h = `<div class="card sum"><div><b>¥${yen(tot)}</b><span>今の合計</span></div><div><b>¥${yen(outT)}</b><span>${md(fc.to)}までの出金</span></div><div><b style="color:${endT<0?"var(--danger)":"inherit"}">${mon("¥",endT)}</b><span>${md(fc.to)}の見込み</span></div></div>`;
  if(al.length) h += `<h3>お知らせ</h3>` + al.map(x=>`<div class="al l${x.lv}"><span>${x.lv===2?"⚠️":x.lv===1?"⚠":"・"} ${esc(x.t)}</span><em>${esc(x.v)}</em></div>`).join("");
  else h += `<div class="al" style="color:var(--accent)">✓ ${md(fc.to)}まで、どの口座も足りています</div>`;
  h += `<h3>口座</h3>`;
  h += fc.accounts.map(a=>{
    const c = cur(a);
    const age = a.base ? (a.age===0 ? "今日" : a.age+"日前") : "";
    let need = "";
    if(a.neg) need = `<div class="need">${md(a.neg.date)}（${wd(a.neg.date)}）の「${esc(a.neg.name)}」で足りなくなります。<b>${md(prevBiz(a.neg.date))}までに ${c}${yen(a.neg.need)} 以上</b>の入金が必要です。</div>`;
    else if(a.lowHit) need = `<div class="need w">${md(a.lowHit.date)}の「${esc(a.lowHit.name)}」のあと、下限（${c}${yen(a.low)}）を下回ります。下限まで ${c}${yen(a.lowHit.need)} 足りません。</div>`;
    const ev = open[a.id] ? `<table class="ev">${a.has?`<tr><td>${a.base?md(a.base):""}</td><td>今の残高</td><td class="r"></td><td class="r">${c}${yen(a.balance)}</td></tr>`:""}${a.events.map(e=>`<tr><td>${md(e.date)}(${wd(e.date)})</td><td>${esc(e.name)}${e.est?'<span class="tag">目安</span>':""}</td><td class="r ${e.sign<0?"m":"p"}">${e.sign<0?"−":"＋"}${yen(e.amount)}</td><td class="r ${e.after<0?"neg":""}">${a.has?mon(c,e.after):""}</td></tr>`).join("") || `<tr><td colspan="4" class="meta">${md(fc.to)}までの予定はありません</td></tr>`}</table>` : "";
    return `<div class="card acc"><div class="nm"><span>${esc(a.name)}</span><span class="bd ${a.status}">${a.status==="OK"?"足りる":a.status}</span></div>

function prevBiz(s){ let d = new Date(pD(s).getTime()-D1); let n=0; while(!isBiz(d) && n++<10) d = new Date(d.getTime()-D1); return fYmd(d); }
function viewCal(fc){
  const accName = {}; data.accounts.forEach(a=>accName[a.id]=a);
  const from = today().slice(0,7)+"-01";
  const all = occurrences(data.plans, data.ovr, from, fc.to);
  const after = {}; fc.accounts.forEach(a=>a.events.forEach(e=>after[e.id]=e.after));
  if(!all.length) return `<div class="empty">まだ予定がありません。<br>下のボタンから融資の返済やクレカの引き落としを登録してください。</div>`;
  const by = {}; all.forEach(e=>{ const k = e.date.slice(0,7); (by[k]=by[k]||[]).push(e); });
  return Object.keys(by).map(ym=>{
    const list = by[ym], o = list.filter(e=>e.sign<0).reduce((s,e)=>s+e.amount,0), i = list.filter(e=>e.sign>0).reduce((s,e)=>s+e.amount,0);
    return `<h3><span>${+ym.slice(0,4)}年${+ym.slice(5)}月</span><span>出金 ${yen(o)} ／ 入金 ${yen(i)}</span></h3><div class="list">` + list.map(e=>{
      const a = accName[e.acct], past = e.date < today();
      return `<div class="item" data-occ="${esc(e.id)}" style="${e.done?"opacity:.45":""}"><div class="d">${md(e.date)}<small>${wd(e.date)}</small></div>
        <div class="x"><div>${esc(e.name)}${e.est&&!past?'<span class="tag">金額未入力</span>':""}${e.done?'<span class="tag k">済</span>':past?'<span class="tag k">済？</span>':""}</div><small>${esc(e.kind)}・${esc(a?a.name:"口座未設定")}</small></div>
        <div class="a" style="color:${e.sign<0?"var(--fg)":"var(--accent)"}">${e.sign<0?"−":"＋"}${cur(a)}${yen(e.amount)}${after[e.id]!==undefined?`<small style="${after[e.id]<0?"color:var(--danger)":""}">残 ${mon("",after[e.id])}</small>`:""}</div></div>`;
    }).join("") + `</div>`;
  }).join("") + `<p class="hint">「済？」は残高を入れた日より前の予定です。銀行で引き落とし済みなのに残高を更新していないときは、残高を入れ直すと自動で計算から外れます。</p>`;
}
function viewReg(){
  const accName = {}; data.accounts.forEach(a=>accName[a.id]=a.name);
  let h = "";
  KINDS.forEach(k=>{
    const ps = data.plans.filter(p=>p.kind===k); if(!ps.length) return;
    h += `<h3><span>${k}</span><span>${ps.length}件</span></h3><div class="list">` + ps.map(p=>{
      const when = p.freq==="1回" ? (p.date||"日付未設定") : (p.freq==="毎年" ? `毎年${p.month}月` : "毎月") + (p.day==="末"||!p.day ? "末日" : p.day+"日");
      let left = ""; if(p.end && p.freq==="毎月"){ const t = today().slice(0,7); let n=0, ym=t; while(ym<=p.end && n<600){ n++; ym=addYm(ym,1); } left = ` ・残り約${n}回（最終${p.end.replace("-","/")}）`; }
      return `<div class="item" data-plan="${esc(p.id)}"><div class="x"><div>${esc(p.name)}${+p.vary?'<span class="tag k">毎月変わる</span>':""}</div><small>${esc(when)}・${esc(accName[p.acct]||"口座未設定")}${esc(left)}</small></div><div class="a">${p.kind==="入金"?"＋":"−"}${yen(p.amount)}${+p.vary?"<small>目安</small>":""}</div></div>`;
    }).join("") + `</div>`;
  });
  if(!h) h = `<div class="empty">まだ予定がありません</div>`;
  h += `<h3><span>口座</span><button class="btn" type="button" id="addAcc" style="min-height:30px;padding:2px 10px;font-size:12px">＋ 口座</button></h3><div class="list">` + data.accounts.map(a=>`<div class="item" data-acc="${esc(a.id)}"><div class="x"><div>${esc(a.name)}</div><small>${a.cur==="USD"?"ドル口座":"円口座"}・下限 ${cur(a)}${yen(a.low)}</small></div><div class="a">›</div></div>`).join("") + `</div>`;
  const s = data.settings;
  h += `<h3>設定</h3><div class="card" style="font-size:14px">見る期間：${+s.months||1}か月先の月末まで ／ 更新が古いと知らせる：${+s.staleDays||7}日 ／ ドル換算：1ドル＝${+s.usdRate||150}円<div class="row"><button class="btn" type="button" id="editSet">設定を変える</button></div>
    <p class="hint" style="margin-top:8px">不足・下限割れ・残高の更新忘れがあると、毎日11時台に ${esc(s.mail||"rekil.usedclothing@gmail.com")} へメールします。</p></div>`;
  return h;
}
