<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ReKiL 給与">
<meta name="theme-color" content="#0d1014">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ReKiL 給与</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ReKiL系アプリ共通の濃色。アクセントは緑（給与・支給） */
:root{
  --bg:#14181d; --surface:#1d232a; --surface2:#232a33; --line:#2f3740; --fg:#e8ebee; --muted:#9aa4af;
  --accent:#4cc38a; --accent-ink:#06170f; --accent-soft:#173226; --steel:#0d1014;
  --blue:#6fb3ff; --orange:#ff9f6b; --warn:#f5c026; --ng:#ff7a6b;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.55;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;white-space:nowrap}
.brand i{width:10px;height:22px;background:var(--accent);border-radius:2px;display:inline-block}
.upd{display:flex;align-items:center;gap:8px}
.upd small{font-size:11px;color:var(--muted);white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.ctrl{display:flex;gap:8px;align-items:center;margin-top:10px;overflow-x:auto}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.seg button{background:none;border:0;color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{font:inherit;font-size:14px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;max-width:62vw}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;font-size:14px;padding:9px 6px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,select:focus{outline:2px solid var(--accent);outline-offset:1px}
main{max-width:980px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.num,.tile b,.pt b,td.r,th.r{font-family:var(--num);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:20px;margin-top:2px}
.tile small{font-size:11.5px;color:var(--muted)}
.tile.main b{color:var(--accent)}
.tile.ded b{color:var(--orange)}
.gl{display:flex;align-items:baseline;gap:8px;font-weight:900;font-size:16px;margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.gl small{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.sh{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:16px 0 8px}
.cards{display:flex;flex-direction:column;gap:8px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--fg);padding:11px 14px;text-align:left}
.ph .pl{flex:1;font-weight:700;font-size:14px}
.ph .pt{text-align:right}
.ph .pt b{font-size:16px;color:var(--accent)}
.ph .pt small{display:block;font-size:11px;color:var(--muted)}
.ph .cv{color:var(--muted);font-size:11px;transition:transform .2s}
.pc.open .cv{transform:rotate(180deg)}
.pb{display:none;padding:0 14px 12px;flex-direction:column;gap:8px}
.pc.open .pb{display:flex}
.bar{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;background:var(--surface2);border-radius:8px;padding:7px 10px}
.bar .n{font-size:13px;font-weight:700;white-space:nowrap}
.bar .n em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:500;margin-left:3px}
.bar .t{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar .t i.blue{background:var(--blue)}.bar .t i.orange{background:var(--orange)}
.bar .a{font-family:var(--num);font-size:13.5px;min-width:5.5em;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.chips b{color:var(--fg);font-family:var(--num);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th{background:var(--surface2);color:var(--muted);font-weight:500;font-size:12px;padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
tr.tot td{font-weight:700;background:var(--surface2);color:var(--accent)}
td.net{color:var(--accent);font-weight:600}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 7px;margin-left:6px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.state{text-align:center;color:var(--muted);padding:48px 16px}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px}
#lock form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
#lock h2{margin:0;font-size:20px}
#lock input{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
#lock .go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;font-weight:700}
#lock p{margin:0;font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><i></i>ReKiL 給与</div>
    <div class="upd"><small id="upd"></small><button class="btn" id="reload" type="button">更新</button></div>
  </div>
  <div class="ctrl">
    <div class="seg" role="group" aria-label="期間の区切り">
      <button type="button" data-mode="fiscal">法人期</button>
      <button type="button" data-mode="calendar">暦年</button>
    </div>
    <select id="ysel" aria-label="期間"></select>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview">概要</button>
    <button class="tab" role="tab" data-tab="staff">スタッフ別</button>
    <button class="tab" role="tab" data-tab="tax">社保・税</button>
    <button class="tab" role="tab" data-tab="table">月別一覧</button>
  </div>
</header>

<main id="view"><div class="state"><div class="spin"></div><br>読み込み中…</div></main>

<div id="lock" hidden>
  <form id="lockForm">
    <div class="brand"><i></i>ReKiL 給与</div>
    <h2>暗証番号</h2>
    <p id="lockMsg"></p>
    <input id="passIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="暗証番号" aria-label="暗証番号">
    <button class="go" id="lockGo" type="submit">開く</button>
  </form>
</div>

<script>
/* ▼ Apps Script をデプロイしたときの「ウェブアプリのURL」 */
const API_URL = "https://script.google.com/macros/s/AKfycbwNWiqaeTw23PfypT3TgOCv5yzfKzFbipU4u9-N8RqWFOFwLfzuaNQdL6oO3yKhytNZ4g/exec";
const APP_VERSION = "2026-11-11-4";
const FISCAL_START = 2025;   // 第1期 = 2025年4月〜2026年3月

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k,d){ try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(_){return d;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(_){} } };
const yen = n => '¥' + Math.round(n||0).toLocaleString('ja-JP');
let pass = '';
try{ pass = localStorage.getItem('rekil-kyuyo-pass') || localStorage.getItem('rekil-pass') || localStorage.getItem('rekil-shiire-pass') || localStorage.getItem('rekil-ebay-pass') || ''; }catch(_){}

let raw = null, rows = [], people = [];
let mode = ls.get('ky-mode','fiscal'), yfilter = 'all', tab = ls.get('ky-tab','overview');

/* ---------- データ取得 ---------- */
class ApiError extends Error{ constructor(c){ super(c); this.code=c; } }
async function api(action){
  if(!API_URL) throw new ApiError('no_api');
  let res;
  try{ res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,pass})}); }
  catch(_){ throw new ApiError('network'); }
  let j; try{ j = await res.json(); }catch(_){ throw new ApiError('bad_response'); }
  if(!j.ok){ if(j.error==='passcode'||j.error==='passcode_not_set') showLock(j.error); throw new ApiError(j.error||'error'); }
  return j.data;
}
async function load(){
  $('#reload').disabled = true;
  try{
    const d = await api('load');
    raw = d; build(); render();
    $('#upd').textContent = '更新 ' + new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(e.code==='passcode'||e.code==='passcode_not_set') { $('#view').innerHTML=''; }
    else $('#view').innerHTML = `<div class="state">${e.code==='no_api'?'データの接続先がまだ設定されていません。':e.code==='network'?'接続できませんでした。電波を確認して「更新」を押してください。':'読み込めませんでした（'+esc(e.code)+'）。'}</div>`;
  }
  $('#reload').disabled = false;
}

/* ---------- 集計 ---------- */
const ORDER = ['祥貴','俊輔','真由美','賢汰','みゆき'];
function build(){
  rows = []; const pmap = new Map();
  for(const y of raw.years){
    for(let m=1;m<=12;m++){
      const r = { year:y.year, m, label:'', fy: m>=4 ? y.year : y.year-1, by:{}, pay:0, bonus:0, incTax:0, hoken:0, jumin:0, nittou:0 };
      for(const s of y.sections){
        const v = s.rows[m]; if(!v) continue;
        r.label = r.label || v.label;
        if(!pmap.has(s.name)) pmap.set(s.name,{name:s.name, roles:new Set(), titles:[]});
        const P = pmap.get(s.name); P.roles.add(s.role); if(!P.titles.includes(s.title)) P.titles.push(s.title);
        const p = r.by[s.name] || (r.by[s.name] = {pay:0,bonus:0,incTax:0,hoken:0,jumin:0,nittou:0,hours:0,days:0,hd:0,pl:0,role:s.role});
        p.pay += v.pay||0; p.bonus += v.bonus||0; p.incTax += v.incTax||0; p.hoken += v.hoken||0; p.jumin += v.jumin||0; p.nittou += v.nittou||0;
        p.hours += v.hours||0; p.days += (v.wd||0)+(v.hd||0); p.hd += v.hd||0; p.pl += v.pl||0;
        if(s.kind==='salary') p.role = s.role;
      }
      for(const p of Object.values(r.by)){ ['pay','bonus','incTax','hoken','jumin','nittou'].forEach(k=>r[k]+=p[k]); p.net = p.pay+p.bonus-p.incTax-p.hoken-p.jumin; }
      r.gross = r.pay + r.bonus; r.ded = r.incTax + r.hoken + r.jumin; r.net = r.gross - r.ded;
      r.label = r.label ? r.label.replace(/\s+/g,'') : `${m===1?12:m-1}/21〜${m}/20`;
      if(r.gross>0 || r.nittou>0) rows.push(r);
    }
  }
  people = [...pmap.values()].sort((a,b)=>(ORDER.indexOf(a.name)+99*(ORDER.indexOf(a.name)<0))-(ORDER.indexOf(b.name)+99*(ORDER.indexOf(b.name)<0)));
  fillYears();
}
const keyOf = r => mode==='fiscal' ? r.fy : r.year;
const glabel = y => mode==='fiscal' ? `第${y-FISCAL_START+1}期（${y}/4〜${y+1}/3）` : `${y}年（締め月1〜12月）`;
function fillYears(){
  const ys=[...new Set(rows.map(keyOf))].sort((a,b)=>b-a);
  const sel=$('#ysel'), prev=String(yfilter);
  sel.innerHTML='<option value="all">全期間</option>'+ys.map(y=>`<option value="${y}">${glabel(y)}</option>`).join('');
  sel.value = ys.map(String).includes(prev) ? prev : 'all'; yfilter = sel.value;
}
function groups(){
  const m=new Map(); rows.forEach(r=>{const k=keyOf(r); if(!m.has(k)) m.set(k,[]); m.get(k).push(r);});
  return [...m.entries()].map(([y,rs])=>({y,label:glabel(y),rows:rs})).filter(g=>yfilter==='all'||String(g.y)===String(yfilter)).sort((a,b)=>b.y-a.y);
}
const sum=(rs,f)=>rs.reduce((a,r)=>a+(typeof f==='function'?f(r):r[f]||0),0);
const roleOf = n => { const P=people.find(p=>p.name===n); if(!P) return ''; return P.roles.has('役員')?'役員':P.roles.has('社員')?'社員':'時給'; };
const colorOf = n => { const r=roleOf(n); return r==='役員'?'blue':r==='社員'?'orange':''; };

/* ---------- 画面 ---------- */
function bars(r){
  const names=people.map(p=>p.name).filter(n=>r.by[n] && (r.by[n].pay+r.by[n].bonus)>0);
  const max=Math.max(1,...names.map(n=>r.by[n].pay+r.by[n].bonus));
  return names.map(n=>{const v=r.by[n].pay+r.by[n].bonus;return `<div class="bar"><span class="n">${esc(n)}<em>${roleOf(n)}</em></span><span class="t"><i class="${colorOf(n)}" style="width:${Math.round(v/max*100)}%"></i></span><span class="a">${yen(v)}</span></div>`;}).join('');
}
function periodCard(r,open){
  return `<div class="pc${open?' open':''}"><button class="ph" type="button"><span class="pl">${esc(r.label)}<br><small style="color:var(--muted);font-weight:500">${r.year}年${r.m}月締め</small></span><span class="pt"><b>${yen(r.gross)}</b><small>差引 ${yen(r.net)}</small></span><span class="cv">▼</span></button>
  <div class="pb">${bars(r)}<div class="chips">${r.bonus?`<span>賞与 <b>${yen(r.bonus)}</b></span>`:''}<span>所得税 <b>${yen(r.incTax)}</b></span><span>社保 <b>${yen(r.hoken)}</b></span><span>住民税 <b>${yen(r.jumin)}</b></span><span>日当 <b>${yen(r.nittou)}</b></span></div></div></div>`;
}
function tiles(rs){
  return `<div class="tiles"><div class="tile main"><span>支給合計（税引前）</span><b>${yen(sum(rs,'gross'))}</b><small>給与・報酬・賞与</small></div>
  <div class="tile main"><span>うち賞与</span><b>${yen(sum(rs,'bonus'))}</b><small>社員・役員の賞与</small></div>
  <div class="tile ded"><span>控除合計</span><b>${yen(sum(rs,'ded'))}</b><small>所得税・社保・住民税</small></div>
  <div class="tile main"><span>差引支給（手取り）</span><b>${yen(sum(rs,'net'))}</b><small>日当は含まない</small></div>
  <div class="tile"><span>日当合計</span><b>${yen(sum(rs,'nittou'))}</b><small>出張日当（非課税）</small></div></div>`;
}
function vOverview(){
  const gs=groups(); if(!gs.length) return '<div class="state">表示できるデータがありません。</div>';
  const now=new Date(); const closed=rows.filter(r=>new Date(r.year,r.m-1,20,23,59)<=now); const last=closed[closed.length-1]||rows[rows.length-1]; let h='';
  if(last && yfilter==='all'){ h+=`<div class="sh">直近の締め期間（締め日を過ぎたもの）</div><div class="cards">${periodCard(last,true)}</div>`; }
  for(const g of gs){
    h+=`<div class="gl">${esc(g.label)}<small>${g.rows.length}か月</small></div>${tiles(g.rows)}<div class="cards">${[...g.rows].reverse().map(r=>periodCard(r,false)).join('')}</div>`;
  }
  return h;
}
function vStaff(){
  const gs=groups(); const fr=gs.flatMap(g=>g.rows); let h='';
  for(const P of people){
    const pr=fr.filter(r=>r.by[P.name]); if(!pr.length) continue;
    const g=k=>sum(pr,r=>r.by[P.name][k]); const isH=roleOf(P.name)==='時給'||g('hours')>0;
    const tot=g('pay')+g('bonus'), ded=g('incTax')+g('hoken')+g('jumin'); const hasB=roleOf(P.name)!=='時給'||g('bonus')>0;
    h+=`<div class="gl">${esc(P.name)}<span class="tag">${roleOf(P.name)}</span><small>${yfilter==='all'?'全期間':esc(gs[0].label)}</small></div>`;
    h+=`<p class="note">${P.titles.map(esc).join('<br>')}</p>`;
    h+=`<div class="tiles"><div class="tile main"><span>支給合計</span><b>${yen(tot)}</b>${g('bonus')?`<small>うち賞与 ${yen(g('bonus'))}</small>`:''}</div>${hasB?`<div class="tile main"><span>賞与合計</span><b>${yen(g('bonus'))}</b></div>`:''}${ded?`<div class="tile ded"><span>控除合計</span><b>${yen(ded)}</b></div>`:''}<div class="tile main"><span>差引（手取り）</span><b>${yen(tot-ded)}</b></div><div class="tile"><span>日当合計</span><b>${yen(g('nittou'))}</b></div>${isH?`<div class="tile"><span>稼働時間・出勤日数</span><b>${g('hours')}h</b><small>${g('days')}日（うち休日${g('hd')}日）</small></div>`:''}</div>`;
    h+=`<div class="tw"><table><tr><th>締め期間</th>${isH?'<th class="r">稼働</th><th class="r">出勤</th>':''}<th class="r">${hasB?'給与・報酬':'支給'}</th>${hasB?'<th class="r">賞与</th>':''}<th class="r">日当</th><th class="r">所得税</th><th class="r">社保</th><th class="r">住民税</th><th class="r">差引</th></tr>`;
    for(const r of [...pr].sort((x,y)=>(y.year*100+y.m)-(x.year*100+x.m))){ const p=r.by[P.name]; if(!(p.pay+p.bonus+p.nittou)) continue;
      h+=`<tr><td>${esc(r.label)}${yfilter==='all'?`<br><small style="color:var(--muted)">${r.year}年${r.m}月締め</small>`:''}</td>${isH?`<td class="r">${p.hours?p.hours+'h':'—'}</td><td class="r">${p.days?p.days+'日':'—'}</td>`:''}<td class="r">${yen(p.pay)}</td>${hasB?`<td class="r">${p.bonus?yen(p.bonus):'—'}</td>`:''}<td class="r">${p.nittou?yen(p.nittou):'—'}</td><td class="r">${p.incTax?yen(p.incTax):'—'}</td><td class="r">${p.hoken?yen(p.hoken):'—'}</td><td class="r">${p.jumin?yen(p.jumin):'—'}</td><td class="r net">${yen(p.net)}</td></tr>`; }
    h+=`<tr class="tot"><td>合計</td>${isH?`<td class="r">${g('hours')}h</td><td class="r">${g('days')}日</td>`:''}<td class="r">${yen(g('pay'))}</td>${hasB?`<td class="r">${yen(g('bonus'))}</td>`:''}<td class="r">${yen(g('nittou'))}</td><td class="r">${yen(g('incTax'))}</td><td class="r">${yen(g('hoken'))}</td><td class="r">${yen(g('jumin'))}</td><td class="r">${yen(tot-ded)}</td></tr></table></div>`;
  }
  return h||'<div class="state">表示できるデータがありません。</div>';
}
function vTax(){
  const gs=groups(); const fr=gs.flatMap(g=>g.rows);
  const taxed=people.filter(P=>fr.some(r=>r.by[P.name]&&(r.by[P.name].incTax+r.by[P.name].hoken+r.by[P.name].jumin)>0));
  let h=`<div class="tiles"><div class="tile ded"><span>社会保険料（本人負担）</span><b>${yen(sum(fr,'hoken'))}</b></div><div class="tile ded"><span>所得税</span><b>${yen(sum(fr,'incTax'))}</b></div><div class="tile ded"><span>住民税</span><b>${yen(sum(fr,'jumin'))}</b></div>
  ${taxed.map(P=>`<div class="tile"><span>${esc(P.name)}の社保</span><b>${yen(sum(fr,r=>r.by[P.name]?r.by[P.name].hoken:0))}</b></div>`).join('')}</div>
  <p class="note">給与から差し引いた本人負担分です（会社負担分は含みません）。黄色セルが未入力の月は0円で表示されます。</p>`;
  for(const g of gs){
    const rs=g.rows.filter(r=>r.ded>0); if(!rs.length) continue;
    h+=`<div class="gl">${esc(g.label)}</div><div class="tw"><table><tr><th>締め期間</th>${taxed.map(P=>`<th class="r">${esc(P.name)} 所得税</th><th class="r">${esc(P.name)} 社保</th><th class="r">${esc(P.name)} 住民税</th>`).join('')}<th class="r">合計</th></tr>`;
    for(const r of [...rs].reverse()) h+=`<tr><td>${esc(r.label)}</td>${taxed.map(P=>{const p=r.by[P.name]||{};return `<td class="r">${p.incTax?yen(p.incTax):'—'}</td><td class="r">${p.hoken?yen(p.hoken):'—'}</td><td class="r">${p.jumin?yen(p.jumin):'—'}</td>`;}).join('')}<td class="r net">${yen(r.ded)}</td></tr>`;
    h+=`<tr class="tot"><td>合計</td>${taxed.map(P=>['incTax','hoken','jumin'].map(k=>`<td class="r">${yen(sum(rs,r=>r.by[P.name]?r.by[P.name][k]:0))}</td>`).join('')).join('')}<td class="r">${yen(sum(rs,'ded'))}</td></tr></table></div>`;
  }
  return h;
}
function vTable(){
  const gs=groups(); let h='';
  for(const g of gs){
    const names=people.map(p=>p.name).filter(n=>g.rows.some(r=>r.by[n]&&(r.by[n].pay+r.by[n].bonus)>0));
    h+=`<div class="gl">${esc(g.label)}</div><div class="tw"><table><tr><th>締め期間</th>${names.map(n=>`<th class="r">${esc(n)}</th>`).join('')}<th class="r">うち賞与</th><th class="r">支給合計</th><th class="r">控除</th><th class="r">差引</th><th class="r">日当</th></tr>`;
    for(const r of [...g.rows].reverse()) h+=`<tr><td>${esc(r.label)}</td>${names.map(n=>{const p=r.by[n];const v=p?p.pay+p.bonus:0;return `<td class="r">${v?yen(v):'—'}</td>`;}).join('')}<td class="r">${r.bonus?yen(r.bonus):'—'}</td><td class="r"><b>${yen(r.gross)}</b></td><td class="r">${r.ded?yen(r.ded):'—'}</td><td class="r net">${yen(r.net)}</td><td class="r">${r.nittou?yen(r.nittou):'—'}</td></tr>`;
    h+=`<tr class="tot"><td>合計</td>${names.map(n=>`<td class="r">${yen(sum(g.rows,r=>r.by[n]?r.by[n].pay+r.by[n].bonus:0))}</td>`).join('')}<td class="r">${yen(sum(g.rows,'bonus'))}</td><td class="r">${yen(sum(g.rows,'gross'))}</td><td class="r">${yen(sum(g.rows,'ded'))}</td><td class="r">${yen(sum(g.rows,'net'))}</td><td class="r">${yen(sum(g.rows,'nittou'))}</td></tr></table></div>`;
  }
  return h||'<div class="state">表示できるデータがありません。</div>';
}
function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false'));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
  if(!raw) return;
  $('#view').innerHTML = tab==='staff'?vStaff():tab==='tax'?vTax():tab==='table'?vTable():vOverview();
}

/* ---------- 操作 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.mode){ mode=b.dataset.mode; ls.set('ky-mode',mode); yfilter='all'; if(raw) fillYears(); render(); }
  else if(b.dataset.tab){ tab=b.dataset.tab; ls.set('ky-tab',tab); render(); window.scrollTo(0,0); }
  else if(b.classList.contains('ph')) b.closest('.pc').classList.toggle('open');
  else if(b.id==='reload') load();
});
$('#ysel').addEventListener('change',e=>{ yfilter=e.target.value; render(); });

/* ---------- 暗証番号 ---------- */
function showLock(err){
  $('#lock').hidden=false;
  $('#lockMsg').textContent = err==='passcode_not_set' ? 'データ側で暗証番号がまだ設定されていません。Apps Scriptの PASSCODE を書き換えて、もう一度デプロイしてください。'
    : err==='passcode' && pass ? '暗証番号が違います。もう一度入力してください。' : '社内の暗証番号を入力してください。一度入力すると、この端末では次から入力不要です。';
  setTimeout(()=>$('#passIn').focus(),100);
}
$('#lockForm').addEventListener('submit',async e=>{
  e.preventDefault(); pass=$('#passIn').value.trim(); if(!pass) return;
  $('#lockGo').disabled=true; $('#lockGo').textContent='確認中…';
  try{ await api('load'); try{localStorage.setItem('rekil-kyuyo-pass',pass);}catch(_){} $('#lock').hidden=true; $('#passIn').value=''; load(); }
  catch(err){ if(err.code==='network') $('#lockMsg').textContent='接続できませんでした。電波を確認し、それでもだめならデプロイの「アクセスできるユーザー」が「全員」になっているか確認してください。'; else if(err.code!=='passcode'&&err.code!=='passcode_not_set') $('#lockMsg').textContent=`データ側でエラーが起きました（${err.code}）。`; }
  $('#lockGo').disabled=false; $('#lockGo').textContent='開く';
});

/* ---------- 新しい版の自動反映 ---------- */
async function checkUpdate(){
  try{ const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); const m=(await r.text()).match(/const APP_VERSION = "([^"]+)"/);
    if(m&&m[1]!==APP_VERSION) location.replace(location.pathname+'?v='+encodeURIComponent(m[1])); }catch(_){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ checkUpdate(); if(raw) load(); } });

render(); checkUpdate();
if(!API_URL) $('#view').innerHTML='<div class="state">データの接続先がまだ設定されていません。</div>';
else if(!pass) showLock();
else load();
</script>
</body>
</html>
