<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ReKiL 仕入">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ReKiL 仕入記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* ReKiL Stockと同じ濃色の業務アプリ調。見分けやすいようアクセントは緑（レジ・値札のイメージ） */
:root{
  --bg:#14181d; --surface:#1d232a; --line:#2f3740; --fg:#e8ebee; --muted:#9aa4af;
  --accent:#3fd18b; --accent-ink:#0f1a14; --steel:#0d1014; --danger:#ff7a6b; --warn:#f5c026;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-code:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;letter-spacing:.04em}
.brand i{display:inline-block;width:12px;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#1d2228 5px 10px);border-radius:2px}
.sync{font-size:12px;color:#c9d1d9;text-align:right}
main{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-height:48px}
input.big{font-size:18px}
input.price{font-family:var(--font-code);font-size:22px;font-weight:700;text-align:right}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-height:60px;font-size:18px;width:100%}
button.small{min-height:34px;padding:4px 10px;font-size:13px}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-height:34px;padding:4px 12px;font-size:13px;font-weight:500;border-radius:999px;background:var(--bg)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.past{font-size:12px;color:var(--warn);font-weight:700}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sum h2{margin:0;font-size:17px;font-weight:900}
.sum .tot{font-family:var(--font-code);font-weight:700;font-size:18px}
.sum .tot small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:500;margin-right:6px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
ul.list li:first-child{border-top:0}
.nm{font-weight:700;overflow-wrap:anywhere}
.yen{font-family:var(--font-code);font-weight:700;text-align:right}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.tag.wait{color:var(--warn)}
.tag.mine{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f2f4f6;color:#111;padding:10px 16px;border-radius:8px;font-weight:700;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 24px #0008}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#lock h2{margin:0;font-size:20px}
.note{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>ReKiL 仕入記帳</div>
  <div class="sync" id="sync">接続中…</div>
</header>

<main>
  <form class="panel" id="form" autocomplete="off" novalidate>
    <label class="f"><span class="label">仕入先</span>
      <input id="shop" class="big" placeholder="例：BOOKOFF相模原" enterkeyhint="next" list="shopList">
      <datalist id="shopList"></datalist>
    </label>
    <div class="chips" id="shopChips" aria-label="最近の仕入先"></div>

    <label class="f"><span class="label">商品名</span>
      <input id="name" class="big" placeholder="例：GUCCIショルダーバッグ" enterkeyhint="next">
    </label>

    <label class="f"><span class="label">仕入値（円）</span>
      <input id="price" class="price" inputmode="numeric" placeholder="0" enterkeyhint="done">
    </label>

    <details id="more">
      <summary>備考・仕入日を変える</summary>
      <div class="row2" style="margin-top:10px">
        <label class="f"><span class="label">仕入日</span><input id="date" type="date"></label>
        <label class="f"><span class="label">備考（任意）</span><input id="note" placeholder="型番など"></label>
      </div>
    </details>
    <p class="past" id="pastMsg" hidden></p>

    <button class="primary" id="go" type="submit">記帳する</button>
  </form>

  <section class="panel" aria-labelledby="listT">
    <div class="sum">
      <h2 id="listT">今日の記帳</h2>
      <div class="tot"><small id="cnt">0点</small><span id="tot">¥0</span></div>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">まだありません。上から記帳すると、商品リストに入った内容がここに出ます。</p>
    <p class="note">商品リストに入っているその日の仕入をすべて表示しています（オークション分も含む）。「取消」はこのスマホから記帳した分だけ出ます。</p>
  </section>
</main>

<div id="lock" hidden>
  <form id="lockForm">
    <div class="brand"><i></i>ReKiL 仕入記帳</div>
    <h2>暗証番号</h2>
    <p class="note" id="lockMsg"></p>
    <input id="passIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="暗証番号" aria-label="暗証番号">
    <button class="primary" id="lockGo" type="submit">開く</button>
  </form>
</div>

<script>
/* ▼ Apps Script をデプロイしたときの「ウェブアプリのURL」 */
const API_URL = "https://script.google.com/macros/s/AKfycbwMrGyfC24OulRxZ5xkpKnA0rPlK1Fi0wWacCv17PgV7FsUF7CPBVEKj9O5TVpwHW6y/exec";
const APP_VERSION = "2026-11-08-3";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + Number(n||0).toLocaleString("ja-JP");
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(_){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
};
const todayStr = () => { const d = new Date(Date.now() + 9*3600e3); return d.toISOString().slice(0,10).replace(/-/g,"/"); }; // 日本時間
const toInput = s => s.replace(/\//g,"-");
const fromInput = s => s.replace(/-/g,"/");

let pass = "";
try{ pass = localStorage.getItem("rekil-shiire-pass") || localStorage.getItem("rekil-pass") || ""; }catch(_){}
let queue = ls.get("shiire-queue", []);          // 送信待ち（電波が悪いとき）
let mine = ls.get("shiire-mine", []);            // このスマホから記帳した分（取消用）
let serverRows = [], shops = ls.get("shiire-shops", []), viewDate = todayStr(), online = false, sending = false;

class ApiError extends Error{ constructor(c){ super(c); this.code = c; } }
async function api(action, params={}){
  if(!API_URL) throw new ApiError("no_api");
  let res;
  try{
    res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action, pass, date:viewDate, ...params})});
  }catch(_){ throw new ApiError("network"); }
  let j; try{ j = await res.json(); }catch(_){ throw new ApiError("bad_response"); }
  if(!j.ok){ if(j.error==="passcode"||j.error==="passcode_not_set") showLock(j.error); throw new ApiError(j.error||"error"); }
  if(j.date === viewDate){ serverRows = j.rows || []; }
  if(j.shops){ shops = j.shops; ls.set("shiire-shops", shops); }
  online = true; render();
  return j.result;
}

function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

/* ---------- 表示 ---------- */
function render(){
  const isToday = viewDate === todayStr();
  $("#listT").textContent = isToday ? "今日の記帳" : `${viewDate.slice(5)} の記帳`;
  const waiting = queue.filter(q=>q.date===viewDate);
  const rows = [
    ...serverRows.map(r=>({...r, state:"ok"})),
    ...waiting.map(q=>({name:q.name, price:q.price, shop:q.shop, note:q.note, state:"wait", cid:q.cid}))
  ];
  // 取消ボタンは、このスマホから記帳したものに1対1で対応づける
  const pool = mine.filter(m=>m.date===viewDate).map(m=>({...m}));
  for(let i=rows.length-1;i>=0;i--){
    const r = rows[i]; if(r.state!=="ok") continue;
    const k = pool.findIndex(m=>!m.used && m.name===r.name && Number(m.price)===Number(r.price) && m.shop===r.shop);
    if(k>=0){ pool[k].used = true; r.mine = pool[k].cid; }
  }
  const total = rows.reduce((s,r)=>s+Number(r.price||0),0);
  $("#cnt").textContent = `${rows.length}点`;
  $("#tot").textContent = yen(total);
  $("#empty").hidden = rows.length>0;
  $("#list").innerHTML = rows.slice().reverse().map(r=>`
    <li>
      <span class="nm">${esc(r.name)}</span><span class="yen">${yen(r.price)}</span>
      <div class="meta"><span>${esc(r.shop)}${r.note?`　${esc(r.note)}`:""}</span>
        ${r.state==="wait" ? `<span class="tag wait">送信待ち</span>`
          : r.mine ? `<button class="small danger" type="button" data-undo="${esc(r.mine)}">取消</button>` : ""}
      </div>
    </li>`).join("");

  const cur = $("#shop").value.trim();
  $("#shopChips").innerHTML = shops.slice(0,12).map(s=>`<button type="button" aria-pressed="${s===cur}" data-shop="${esc(s)}">${esc(s)}</button>`).join("");
  $("#shopList").innerHTML = shops.map(s=>`<option value="${esc(s)}">`).join("");

  $("#pastMsg").hidden = isToday;
  $("#pastMsg").textContent = isToday ? "" : `仕入日 ${viewDate} で記帳します（今日ではありません）`;
  status();
}
function status(){
  const w = queue.length;
  $("#sync").textContent = sending ? "送信中…" : w ? `送信待ち ${w}件` : online ? "接続済み" : "未接続";
}

/* ---------- 記帳 ---------- */
$("#shopChips").addEventListener("click", e=>{
  const b = e.target.closest("[data-shop]"); if(!b) return;
  $("#shop").value = b.dataset.shop; ls.set("shiire-lastshop", b.dataset.shop); render(); $("#name").focus();
});
$("#shop").addEventListener("change", ()=>{ ls.set("shiire-lastshop", $("#shop").value.trim()); render(); });
$("#name").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#price").focus(); } });
$("#shop").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#name").focus(); } });
$("#price").addEventListener("input", ()=>{
  const v = $("#price").value.replace(/[^\d]/g,"").replace(/^0+(?=\d)/,"");
  $("#price").value = v ? Number(v).toLocaleString("ja-JP") : "";
});
$("#date").addEventListener("change", ()=>{
  viewDate = $("#date").value ? fromInput($("#date").value) : todayStr();
  serverRows = []; render(); refresh();
});

$("#form").addEventListener("submit", e=>{
  e.preventDefault();
  const shop = $("#shop").value.trim(), name = $("#name").value.trim();
  const price = $("#price").value.replace(/[^\d]/g,""), note = $("#note").value.trim();
  if(!shop){ toast("仕入先を入れてください"); $("#shop").focus(); return; }
  if(!name){ toast("商品名を入れてください"); $("#name").focus(); return; }
  if(price===""){ toast("仕入値を入れてください"); $("#price").focus(); return; }
  const cid = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const item = {cid, shop, name, price:Number(price), note, date:viewDate};
  queue.push(item); ls.set("shiire-queue", queue);
  ls.set("shiire-lastshop", shop);
  $("#name").value = ""; $("#price").value = ""; $("#note").value = "";
  render(); $("#name").focus();
  flush();
});

async function flush(){
  if(sending || !queue.length || !pass) return;
  sending = true; status();
  let failed = false;
  while(queue.length){
    const q = queue[0];
    try{
      await api("add", q);
      queue.shift(); ls.set("shiire-queue", queue);
      mine.push({cid:q.cid, name:q.name, price:q.price, shop:q.shop, date:q.date});
      mine = mine.slice(-200); ls.set("shiire-mine", mine);
      toast(`記帳しました：${q.name}`);
    }catch(err){
      if(err.code==="network"){ failed = true; break; }
      if(err.code==="passcode"||err.code==="passcode_not_set"){ failed = true; break; }
      // 内容の不備などで入らなかったものは外して知らせる
      queue.shift(); ls.set("shiire-queue", queue);
      toast(`記帳できませんでした：${q.name}（${err.code}）`);
    }
  }
  sending = false; render();
  if(failed && queue.length){ toast("電波が弱いため送信待ちにしました。つながったら自動で送ります"); setTimeout(flush, 15000); }
}

/* ---------- 取消 ---------- */
$("#list").addEventListener("click", async e=>{
  const b = e.target.closest("[data-undo]"); if(!b) return;
  const m = mine.find(x=>x.cid===b.dataset.undo); if(!m) return;
  if(!confirm(`「${m.name}」${yen(m.price)} を商品リストから消します。よろしいですか？`)) return;
  b.disabled = true;
  try{
    await api("remove", {name:m.name, price:m.price, shop:m.shop, date:m.date});
    mine = mine.filter(x=>x.cid!==m.cid); ls.set("shiire-mine", mine); render();
    toast("取り消しました");
  }catch(err){
    b.disabled = false;
    toast(err.code==="not_found" ? "商品リストで見つかりませんでした（すでに編集・削除済みかもしれません）" : "取り消せませんでした。もう一度お試しください");
    if(err.code==="not_found"){ mine = mine.filter(x=>x.cid!==m.cid); ls.set("shiire-mine", mine); render(); }
  }
});

/* ---------- 暗証番号 ---------- */
function showLock(err){
  online = false;
  $("#lock").hidden = false;
  $("#lockMsg").textContent = err==="passcode_not_set" ? "データ側で暗証番号がまだ設定されていません。Apps Scriptの PASSCODE を書き換えて、もう一度デプロイしてください。"
    : err==="passcode" && pass ? "暗証番号が違います。もう一度入力してください。" : "社内の暗証番号を入力してください。一度入力すると、このスマホでは次から入力不要です。";
  setTimeout(()=>$("#passIn").focus(), 100);
}
$("#lockForm").addEventListener("submit", async e=>{
  e.preventDefault();
  pass = $("#passIn").value.trim(); if(!pass) return;
  $("#lockGo").disabled = true; $("#lockGo").textContent = "確認中…";
  try{
    await api("list");
    try{ localStorage.setItem("rekil-shiire-pass", pass); }catch(_){}
    $("#lock").hidden = true; $("#passIn").value = ""; toast("接続しました"); flush();
  }catch(err){
    const c = err && err.code || "";
    if(c==="network") $("#lockMsg").textContent = "データ側（Apps Script）に接続できませんでした。電波を確認し、それでもだめならデプロイの「アクセスできるユーザー」が「全員」になっているか確認してください。";
    else if(c!=="passcode" && c!=="passcode_not_set") $("#lockMsg").textContent = `データ側でエラーが起きました。（エラー：${c}）`;
  }
  $("#lockGo").disabled = false; $("#lockGo").textContent = "開く";
});

/* ---------- 同期 ---------- */
let refreshing = false;
async function refresh(){
  if(refreshing || sending || !pass || !API_URL) return; refreshing = true;
  try{ await api("list"); }catch(err){ if(err.code==="network"){ online = false; status(); } }
  refreshing = false;
}
setInterval(()=>{ if(document.visibilityState==="visible"){ if(queue.length) flush(); else refresh(); } }, 30000);
window.addEventListener("online", flush);

/* ---------- 新しい版の自動反映 ---------- */
async function checkUpdate(){
  try{
    const r = await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"});
    const t = await r.text(); const m = t.match(/const APP_VERSION = "([^"]+)"/);
    if(m && m[1] !== APP_VERSION && !sending){ location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])); }
  }catch(_){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  checkUpdate();
  // 日付が変わっていたら今日に戻す
  if(!$("#date").value && viewDate !== todayStr()){ viewDate = todayStr(); serverRows = []; }
  if(queue.length) flush(); else refresh();
});

/* ---------- 起動 ---------- */
$("#shop").value = ls.get("shiire-lastshop", "");
render();
if(!API_URL){ $("#sync").textContent = "未設定"; toast("データの接続先がまだ設定されていません"); }
else if(!pass) showLock();
else { checkUpdate(); refresh().then(()=>{ if(queue.length) flush(); }); }
</script>
</body>
</html>
