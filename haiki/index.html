<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="廃棄記録">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ReKiL 廃棄記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#14181d; --surface:#1d232a; --ink:#e8ebee; --muted:#9aa4af; --line:#2f3740;
  --acc:#ff7a6b; --acc-ink:#2a0d09; --ok:#3fd18b; --warn:#f2c230; --chip:#262d35; --steel:#0d1014;
  --f-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sync{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--f-num);white-space:nowrap}
.stripe{height:6px;margin-top:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--acc) 0 8px,#3a1f1c 8px 16px)}
@media (max-width:480px){.brand .hint{display:none}}
.status{font-size:12px;color:var(--muted);margin:8px 0 0;min-height:1em}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input[type=search]{font-size:16px}
textarea{resize:vertical;font-size:16px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.sum .todo b{color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.thumb{width:64px;height:64px;border-radius:6px;background:var(--chip);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:11px;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;font-family:var(--f-num);font-size:11px;border-radius:4px;padding:0 4px}
.item .body{min-width:0}
.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reason{font-size:13px;color:var(--ink);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.need{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-block;font-size:11px;background:var(--chip);border-radius:4px;padding:0 6px}
.tag.miss{background:#3a1f1c;color:var(--acc)}
.tag.gone{background:#3a3214;color:var(--warn)}
.arrow{color:var(--muted);font-size:20px}
.sect{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-weight:700;font-size:14px;color:var(--muted)}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
button.sect{appearance:none;border:0;background:none;width:100%;font-family:inherit;cursor:pointer;padding:6px 0;text-align:left}
.caret{font-size:10px;transition:transform .15s}
.sect[aria-expanded="true"] .caret{transform:rotate(90deg)}
.count{font-family:var(--f-num);font-size:12px;background:var(--chip);border-radius:10px;padding:0 8px}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.hint{font-size:12px;color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94%;overflow:auto;border-radius:14px 14px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.info{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.info dt{color:var(--muted)} .info dd{margin:0;font-family:var(--f-num);word-break:break-all}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .del{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:0;background:#000b;color:#fff;font-size:16px;cursor:pointer;line-height:1}
.ph .new{position:absolute;left:4px;bottom:4px;font-size:10px;background:var(--acc);color:var(--acc-ink);border-radius:4px;padding:0 5px;font-weight:700}
.add{aspect-ratio:1;border:1px dashed var(--muted);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;gap:2px}
.add b{font-size:26px;line-height:1;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.viewer{position:fixed;inset:0;z-index:30;background:#000e;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.viewer .nav{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:12px;align-items:center;color:#fff;font-family:var(--f-num)}
.viewer .nav button{position:static}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:40;max-width:90vw}
.period{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px;margin:0 0 10px}
.period select{padding:8px 8px;font-size:15px}
.pdfbar{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.pdfbar .hint{flex:1;min-width:0}
.mhead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 -2px;font-family:var(--f-num)}
.mhead::after{content:"";flex:1;height:1px;background:var(--line)}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#lock h2{margin:0;font-size:20px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<script>/* rekil-common */try{const K="rekil-haiki-pass",P=localStorage.getItem("rekil-pass");if(P&&!localStorage.getItem(K))localStorage.setItem(K,P)}catch(_){}</script>

<div class="wrap">
  <header>
    <div class="brand"><h1>廃棄記録</h1><span class="hint">廃棄した商品の写真と理由</span><span class="sync" id="sync"></span></div>
    <div class="stripe" aria-hidden="true"></div>
    <div class="sum">
      <div class="todo"><b id="n-todo">0</b><span>未登録</span></div>
      <div><b id="n-done">0</b><span>登録済み</span></div>
      <div><b id="n-all">0</b><span>廃棄の合計</span></div>
    </div>
  </header>
  <p class="status" id="status">読み込み中…</p>

  <div class="period">
    <select id="pmode" aria-label="期間の種類"><option value="ki">法人期</option><option value="year">年</option><option value="all">全期間</option></select>
    <select id="pval" aria-label="期・年"></select>
    <select id="pmonth" aria-label="月"></select>
  </div>
  <div class="pdfbar"><span class="hint" id="plabel"></span><button class="btn sm primary" id="pdf">PDFで出力</button></div>
  <div class="bar"><input id="q" type="search" placeholder="商品名・仕入先・理由で検索" aria-label="検索"></div>
  <p class="hint" style="margin:-4px 0 10px">在庫/売上管理シートの商品リストで、販売先を「廃棄」にした商品が自動でここに出ます。タップして写真と理由を登録してください。</p>

  <div class="list" id="todo"></div>
  <button class="sect" id="done-toggle" aria-expanded="false" aria-controls="done"><span class="caret" aria-hidden="true">▶</span>登録済み <span class="count" id="done-count">0</span></button>
  <div class="list" id="done" hidden></div>
  <div id="gone-wrap" hidden>
    <div class="sect">シートの廃棄から外れた記録 <span class="count" id="gone-count">0</span></div>
    <p class="hint" style="margin:-4px 0 10px">販売先を廃棄以外に直した・期替えで商品リストから消えたものです。写真と理由はそのまま残っています。</p>
    <div class="list" id="gone"></div>
  </div>
</div>

<div id="sheet-root"></div>
<div id="viewer-root"></div>
<div id="toast-root"></div>
<div id="lock" hidden><form id="lockForm">
  <h2>廃棄記録</h2>
  <p class="hint" id="lockMsg">社内の暗証番号を入力してください（ReKiL Stockと同じ番号）。一度入力すると、この端末では次から入力不要です。</p>
  <input id="passIn" type="password" inputmode="numeric" autocomplete="current-password" aria-label="暗証番号">
  <button class="btn primary" id="lockGo">開く</button>
</form></div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ▼ Apps Script をデプロイしたときの「ウェブアプリのURL」 */
const API_URL = "https://script.google.com/macros/s/AKfycbxkxy7ZrqL9cnVaCq6ROX0OMRfYMeDVoYT7C_U-H1D2ENsS3nax-hfNFT7dDMOsItiHTQ/exec";
const APP_VERSION = "2026-11-22-3";
const CACHE = "haiki-data";
const REASONS = ["破損", "汚れ・シミ", "劣化（ベタつき・剥がれ）", "カビ・臭い", "偽物の疑い", "修理不可", "売れ残り"];
let items = [], query = "";
let pass = ""; try{ pass = localStorage.getItem("rekil-haiki-pass") || localStorage.getItem("rekil-pass") || ""; }catch(_){}
try{ const c = JSON.parse(localStorage.getItem(CACHE)||"null"); if(c) items = c.items||[]; }catch(_){}
let busy = 0, online = false;
class ApiError extends Error{ constructor(c){ super(c); this.code = c; } }
function keep(){ try{ localStorage.setItem(CACHE, JSON.stringify({items})); }catch(_){} }
function sync(){ const el=$("#sync"); if(el) el.textContent = (!API_URL?"未設定":busy?"保存中…":online?"接続済み":"未接続")+"  ver "+APP_VERSION.slice(5); }
async function api(action, params={}){
  if(!API_URL) throw new ApiError("no_api");
  busy++; sync();
  try{
    let res;
    try{ res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action, pass, ...params})}); }
    catch(_){ throw new ApiError("network"); }
    let j; try{ j = await res.json(); }catch(_){ throw new ApiError("bad_response"); }
    if(!j.ok){ if(j.error==="passcode") showLock(); throw new ApiError(j.error||"error"); }
    if(j.data && action!=="photo"){ items = j.data.items||[]; keep(); draw(); }
    online = true; return j.result;
  }finally{ busy--; sync(); }
}
function toast(msg){ const r=$("#toast-root"); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",2200); }
function setStatus(t){ $("#status").textContent=t; }

const thumb = (id, w=400) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
const isDone = it => (it.photos||[]).length>0 && String(it.reason||"").trim()!=="";
const yen = s => { const n = String(s||"").replace(/[^\d-]/g,""); return n ? "¥"+Number(n).toLocaleString("ja-JP") : ""; };
/* ---------- 日付・期間 ---------- */
function ymd(it){ const s=String(it.haikiDate||it.buyDate||""); const m=s.match(/(\d{4})\D+(\d{1,2})(?:\D+(\d{1,2}))?/); return m?{y:+m[1],m:+m[2],d:+(m[3]||0)}:null; }
const dkey = it => { const d=ymd(it); return d ? d.y*10000+d.m*100+d.d : 0; };
const byDate = (a,b) => dkey(b)-dkey(a);
const kiOf = (y,m) => m>=4 ? y-2024 : y-2025;          /* 3月決算：第1期＝2025/4/15〜2026/3/31 */
const kiName = k => `第${k}期`;
const kiRange = k => `${2024+k}/4〜${2025+k}/3`;
const ymOf = it => { const d=ymd(it); return d ? d.y*100+d.m : 0; };
let pmode="ki", pval=0, pmonth=0;
try{ const p=JSON.parse(localStorage.getItem("haiki-period")||"null"); if(p){ pmode=p.mode||"ki"; pval=+p.val||0; pmonth=+p.month||0; } }catch(_){}
function inPeriod(it){
  if(pmode==="all") return true;
  const d=ymd(it); if(!d) return false;
  if(pmode==="ki" ? kiOf(d.y,d.m)!==pval : d.y!==pval) return false;
  return !pmonth || d.y*100+d.m===pmonth;
}
function periodLabel(){
  if(pmode==="all") return "全期間";
  const base = pmode==="ki" ? kiName(pval) : pval+"年";
  return pmonth ? `${base} ${Math.floor(pmonth/100)}年${pmonth%100}月` : (pmode==="ki" ? `${base}（${kiRange(pval)}）` : base);
}
function fillPeriod(){
  const inS = items.filter(it=>it.inSheet!==false);
  const now=new Date(), ny=now.getFullYear(), nm=now.getMonth()+1;
  $("#pmode").value = pmode;
  const vSel=$("#pval"), mSel=$("#pmonth");
  vSel.hidden = mSel.hidden = pmode==="all";
  if(pmode==="all"){ return; }
  const count = new Map();
  for(const it of inS){ const d=ymd(it); if(!d) continue; const v = pmode==="ki"?kiOf(d.y,d.m):d.y; count.set(v,(count.get(v)||0)+1); }
  const cur = pmode==="ki" ? kiOf(ny,nm) : ny;
  const vals = [...new Set([...count.keys(), cur])].filter(v=>v>0).sort((a,b)=>b-a);
  if(!vals.includes(pval)) pval = cur;
  vSel.innerHTML = vals.map(v=>`<option value="${v}">${pmode==="ki"?kiName(v):v+"年"}　${count.get(v)||0}件</option>`).join("");
  vSel.value = pval;
  const months = [];
  for(let i=0;i<12;i++){ if(pmode==="ki"){ const m=(3+i)%12+1, y = m>=4 ? 2024+pval : 2025+pval; months.push(y*100+m); } else months.push(pval*100+i+1); }
  const mc = new Map(); for(const it of inS){ const k=ymOf(it); mc.set(k,(mc.get(k)||0)+1); }
  if(pmonth && !months.includes(pmonth)) pmonth = 0;
  mSel.innerHTML = `<option value="0">全月</option>` + months.map(k=>`<option value="${k}">${pmode==="ki"?`${Math.floor(k/100)}年`:""}${k%100}月　${mc.get(k)||0}件</option>`).join("");
  mSel.value = pmonth;
}
function setPeriod(){ try{ localStorage.setItem("haiki-period", JSON.stringify({mode:pmode,val:pval,month:pmonth})); }catch(_){} draw(); }
$("#pmode").onchange = e=>{ pmode=e.target.value; pval=0; pmonth=0; setPeriod(); };
$("#pval").onchange = e=>{ pval=+e.target.value; pmonth=0; setPeriod(); };
$("#pmonth").onchange = e=>{ pmonth=+e.target.value; setPeriod(); };
function withMonths(list){
  if(pmonth) return list.map(card).join("");
  let last=null, out="";
  for(const it of list){ const k=ymOf(it); if(k!==last){ last=k; const n=list.filter(x=>ymOf(x)===k).length; out+=`<div class="mhead">${k?`${Math.floor(k/100)}年${k%100}月`:"日付なし"}<span class="count">${n}</span></div>`; } out+=card(it); }
  return out;
}

function card(it){
  const ph = it.photos||[];
  const img = ph.length ? `<img src="${thumb(ph[0])}" alt="" loading="lazy"><span class="n">${ph.length}</span>` : "写真なし";
  const need = [];
  if(!ph.length) need.push(`<span class="tag miss">写真なし</span>`);
  if(!String(it.reason||"").trim()) need.push(`<span class="tag miss">理由なし</span>`);
  if(it.inSheet===false) need.push(`<span class="tag gone">シートから外れた</span>`);
  return `<button class="item" data-key="${esc(it.key)}">
    <span class="thumb">${img}</span>
    <span class="body">
      <span class="name" style="display:block">${esc(it.name)}</span>
      <span class="meta" style="display:block">${it.haikiDate?"廃棄 "+esc(it.haikiDate):""}${it.no?" ／ No."+esc(it.no):""} ／ ${esc(it.supplier)} ${esc(yen(it.cost))}</span>
      ${String(it.reason||"").trim()?`<span class="reason" style="display:block">${esc(it.reason)}</span>`:""}
      ${need.length?`<span class="need">${need.join("")}</span>`:""}
    </span>
    <span class="arrow" aria-hidden="true">›</span>
  </button>`;
}
function draw(){
  const q = query.trim().toLowerCase();
  const hit = it => !q || [it.name,it.supplier,it.reason,it.memo,it.no,it.haikiDate].join(" ").toLowerCase().includes(q);
  fillPeriod();
  const inS = items.filter(it=>it.inSheet!==false && inPeriod(it)), gone = items.filter(it=>it.inSheet===false && inPeriod(it));
  const todo = inS.filter(it=>!isDone(it)).sort(byDate), done = inS.filter(isDone).sort(byDate);
  $("#n-todo").textContent = todo.length; $("#n-done").textContent = done.length; $("#n-all").textContent = inS.length;
  const t = todo.filter(hit), d = done.filter(hit), g = gone.filter(hit).sort(byDate);
  $("#todo").innerHTML = t.length ? withMonths(t) : `<div class="empty">${q?"該当なし":"未登録の廃棄商品はありません"}</div>`;
  $("#done").innerHTML = d.length ? withMonths(d) : `<div class="empty">${q?"該当なし":"まだありません"}</div>`;
  $("#done-count").textContent = d.length;
  $("#gone-wrap").hidden = !g.length; $("#gone-count").textContent = g.length; $("#gone").innerHTML = g.map(card).join("");
  if(q && d.length) setDoneOpen(true);
  $("#plabel").textContent = `${periodLabel()}：${t.length+d.length}件${q?"（検索中）":""}`;
  $("#pdf").disabled = !(t.length+d.length);
}

/* ---------- 写真の縮小 ---------- */
function shrink(file, max, q){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("画像を読み込めません")); };
    img.src = url;
  });
}

/* ---------- 写真の拡大表示 ---------- */
function openViewer(srcs, i){
  const r=$("#viewer-root");
  const show = ()=>{ r.innerHTML = `<div class="viewer" id="vw"><img src="${srcs[i]}" alt="写真 ${i+1}"><button class="btn sm" id="vx">閉じる</button>
    ${srcs.length>1?`<div class="nav"><button class="btn sm" id="vp">‹ 前</button><span>${i+1} / ${srcs.length}</span><button class="btn sm" id="vn">次 ›</button></div>`:""}</div>`;
    $("#vx").onclick=()=>r.innerHTML="";
    $("#vw").onclick=e=>{ if(e.target.id==="vw") r.innerHTML=""; };
    if($("#vp")){ $("#vp").onclick=()=>{ i=(i-1+srcs.length)%srcs.length; show(); }; $("#vn").onclick=()=>{ i=(i+1)%srcs.length; show(); }; } };
  show();
}

/* ---------- 登録画面 ---------- */
function closeSheet(){ $("#sheet-root").innerHTML=""; }
function openEditor(it){
  /* photos: {id} は保存済み、{data} はこれから送る写真 */
  let photos = (it.photos||[]).map(id=>({id}));
  const removed = [];
  $("#sheet-root").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <h2><span>${esc(it.name)}</span><button class="btn sm" id="close">閉じる</button></h2>
    <dl class="info">
      <dt>廃棄日</dt><dd>${esc(it.haikiDate||"-")}</dd>
      <dt>No.</dt><dd>${esc(it.no||"-")}</dd>
      <dt>仕入先</dt><dd>${esc(it.supplier||"-")}</dd>
      <dt>仕入日</dt><dd>${esc(it.buyDate||"-")}</dd>
      <dt>仕入値</dt><dd>${esc(yen(it.cost)||"-")}</dd>
      ${it.memo?`<dt>備考</dt><dd>${esc(it.memo)}</dd>`:""}
    </dl>
    <div class="field"><label>写真（何枚でも）</label>
      <div class="photos" id="phs"></div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
    <div class="field"><label for="reason">廃棄の理由</label>
      <div class="chips" id="chips">${REASONS.map(r=>`<button type="button" class="chip" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      <textarea id="reason" rows="4" placeholder="例：持ち手の根元が裂けていて修理できない">${esc(it.reason||"")}</textarea>
    </div>
    <div class="row"><span class="hint spacer">${it.updatedAt?`最終更新 ${new Date(it.updatedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`:""}</span><button class="btn primary" id="save">保存</button></div>
  </div></div>`;
  const srcOf = p => p.data || thumb(p.id, 1600);
  const drawPh = ()=>{
    $("#phs").innerHTML = photos.map((p,i)=>`<div class="ph"><img src="${p.data||thumb(p.id)}" alt="写真 ${i+1}" data-i="${i}">${p.data?`<span class="new">未保存</span>`:""}<button class="del" data-del="${i}" aria-label="写真 ${i+1} を削除">×</button></div>`).join("")
      + `<label class="add" for="file"><b>＋</b>写真を追加</label>`;
  };
  drawPh();
  $("#phs").addEventListener("click", e=>{
    const d=e.target.dataset.del; if(d!=null){ const [p]=photos.splice(+d,1); if(p.id) removed.push(p.id); drawPh(); return; }
    const i=e.target.dataset.i; if(i!=null) openViewer(photos.map(srcOf), +i);
  });
  $("#file").onchange = async e=>{
    const files=[...e.target.files]; e.target.value="";
    for(const f of files){ try{ photos.push({data: await shrink(f, 1600, .85)}); }catch(err){ toast(err.message); } }
    drawPh();
  };
  $("#chips").addEventListener("click", e=>{ const r=e.target.dataset.r; if(!r) return; const ta=$("#reason"); const v=ta.value.trim(); ta.value = v ? (v.split(/[、\n]/).includes(r)?v:v+"、"+r) : r; ta.focus(); });
  $("#close").onclick = closeSheet;
  $("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeSheet(); });
  $("#save").onclick = async ()=>{
    if(!API_URL){ toast("データ側がまだ設定されていません"); return; }
    const btn=$("#save"); btn.disabled=true;
    try{
      const pending = photos.filter(p=>p.data);
      for(let k=0;k<pending.length;k++){
        btn.textContent=`写真を送信中… ${k+1}/${pending.length}`;
        const r = await api("photo", {image: pending[k].data.split(",")[1]});
        pending[k].id = r.id; delete pending[k].data;
      }
      btn.textContent="保存中…";
      const rec = {key:it.key, no:it.no, name:it.name, cost:it.cost, supplier:it.supplier, buyDate:it.buyDate, haikiDate:it.haikiDate, memo:it.memo,
        reason: $("#reason").value.trim(), photos: photos.map(p=>p.id)};
      await api("save", {record: rec, removedPhotos: removed});
      closeSheet(); toast(isDone(rec) ? "保存しました" : "保存しました（写真と理由がそろうと登録済みに移ります）");
    }catch(err){
      btn.disabled=false; btn.textContent="保存"; drawPh();
      toast(err.code==="network" ? "通信できず保存できませんでした。電波を確認してもう一度押してください" : `保存できませんでした（${err.code||"error"}）`);
    }
  };
}

/* ---------- PDF出力（表示中の期間・検索の分を1つのPDFに） ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function photoImg(id){
  for(const u of [`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w1000`, thumb(id,1000)]){
    try{ const im = await loadImg(u); const c=document.createElement("canvas"); c.width=c.height=1; c.getContext("2d").drawImage(im,0,0,1,1); c.getContext("2d").getImageData(0,0,1,1); return im; }catch(_){}
  }
  return null;
}
function pdfSheet(html){ $("#sheet-root").innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
$("#pdf").onclick = async ()=>{
  const q = query.trim().toLowerCase();
  const hit = it => !q || [it.name,it.supplier,it.reason,it.memo,it.no,it.haikiDate].join(" ").toLowerCase().includes(q);
  const list = items.filter(it=>it.inSheet!==false && inPeriod(it) && hit(it)).sort((a,b)=>dkey(a)-dkey(b));
  if(!list.length) return;
  const label = periodLabel();
  const nPh = list.reduce((s,it)=>s+(it.photos||[]).length,0);
  pdfSheet(`<h2><span>PDFを作成中…</span></h2><p class="hint">${esc(label)}　${list.length}件・写真${nPh}枚</p><div class="prog"><i id="pg"></i></div><p class="hint" id="pgt">準備中…</p>`);
  const prog = (k,n,t)=>{ const g=$("#pg"); if(g) g.style.width=Math.round(k/n*100)+"%"; const e=$("#pgt"); if(e) e.textContent=t; };
  try{
    if(!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    try{ await document.fonts.load('700 20px "Zen Kaku Gothic New"'); }catch(_){}
    const W=1240, H=1754, M=70, FONT='"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
    const pdf = new jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
    let pageNo=0, cv, cx, y;
    const newPage = ()=>{ if(cv) flush(); cv=document.createElement("canvas"); cv.width=W; cv.height=H; cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,W,H); cx.textBaseline="top"; y=M; pageNo++; };
    const flush = ()=>{ cx.fillStyle="#777"; cx.font=`18px ${FONT}`; cx.textAlign="left"; cx.fillText(`合同会社ReKiL　廃棄記録　${label}`, M, H-50); cx.textAlign="right"; cx.fillText(`${pageNo}`, W-M, H-50); cx.textAlign="left";
      if(pageNo>1) pdf.addPage("a4","portrait"); pdf.addImage(cv.toDataURL("image/jpeg",.82),"JPEG",0,0,210,297,undefined,"FAST"); };
    const bottom = H-M-30;
    const font = (px,b)=>{ cx.font=`${b?700:400} ${px}px ${FONT}`; };
    const wrap = (text,maxW)=>{ const lines=[]; for(const para of String(text||"").split(/\n/)){ let cur=""; for(const ch of para){ if(cx.measureText(cur+ch).width>maxW && cur){ lines.push(cur); cur=ch; } else cur+=ch; } lines.push(cur); } return lines; };
    const clip = (text,maxW)=>{ let t=String(text||""); if(cx.measureText(t).width<=maxW) return t; while(t && cx.measureText(t+"…").width>maxW) t=t.slice(0,-1); return t+"…"; };
    const num = s => Number(String(s||"").replace(/[^\d-]/g,""))||0;

    /* 1) 一覧ページ */
    newPage();
    font(44,true); cx.fillStyle="#111"; cx.fillText("廃棄記録", M, y); y+=64;
    font(26,false); cx.fillText(`${label}${q?`　検索：${query.trim()}`:""}`, M, y); y+=44;
    const total = list.reduce((s,it)=>s+num(it.cost),0), miss = list.filter(it=>!isDone(it)).length;
    font(22,false); cx.fillStyle="#333";
    cx.fillText(`件数 ${list.length}件　／　仕入値合計 ¥${total.toLocaleString("ja-JP")}　／　写真 ${nPh}枚${miss?`　／　写真・理由が未登録 ${miss}件`:""}`, M, y); y+=36;
    cx.fillStyle="#999"; font(18,false); cx.fillText(`作成 ${new Date().toLocaleString("ja-JP")}`, M, y); y+=48;
    const cols=[["廃棄日",150],["No.",110],["商品名",360],["仕入先",170],["仕入値",120],["理由",190]];
    const head = ()=>{ cx.fillStyle="#222"; cx.fillRect(M,y,W-2*M,40); font(19,true); cx.fillStyle="#fff"; let x=M+8; for(const [h,w] of cols){ cx.fillText(h,x,y+9); x+=w; } y+=40; };
    head();
    list.forEach((it,i)=>{
      if(y+36>bottom){ newPage(); head(); }
      if(i%2){ cx.fillStyle="#f2f2f2"; cx.fillRect(M,y,W-2*M,36); }
      font(19,false); cx.fillStyle="#111"; let x=M+8;
      const vals=[it.haikiDate||it.buyDate||"", it.no||"", it.name||"", it.supplier||"", yen(it.cost), String(it.reason||"").replace(/\n/g," ")||"（未登録）"];
      cols.forEach(([,w],k)=>{ cx.fillText(clip(vals[k],w-14),x,y+8); x+=w; }); y+=36;
    });

    /* 2) 1件ごとの写真と理由 */
    const GAP=16, CW=(W-2*M-2*GAP)/3;
    let done=0;
    newPage();
    for(let n=0;n<list.length;n++){
      const it=list[n], ph=it.photos||[];
      font(30,true); const nameL=wrap(it.name,W-2*M).slice(0,2);
      font(22,false); const reasonL=wrap("理由："+(String(it.reason||"").trim()||"（未登録）"),W-2*M-24);
      const headH = 14+nameL.length*42+34+reasonL.length*32+28;
      if(y+headH+(ph.length?CW:60)>bottom && y>M) newPage();
      cx.fillStyle="#111"; cx.fillRect(M,y,8,headH-24); y+=4;
      font(30,true); for(const l of nameL){ cx.fillText(l,M+24,y); y+=42; }
      font(20,false); cx.fillStyle="#555";
      cx.fillText(clip([`廃棄日 ${it.haikiDate||"-"}`, it.no?`No.${it.no}`:"", `仕入先 ${it.supplier||"-"}`, `仕入日 ${it.buyDate||"-"}`, `仕入値 ${yen(it.cost)||"-"}`].filter(Boolean).join("　"),W-2*M-24), M+24, y); y+=34;
      font(22,false); cx.fillStyle="#111"; for(const l of reasonL){ cx.fillText(l,M+24,y); y+=32; }
      y+=20;
      if(!ph.length){ font(20,false); cx.fillStyle="#b33"; cx.fillText("写真なし", M+24, y); y+=40; }
      for(let r=0;r<ph.length;r+=3){
        if(y+CW>bottom) newPage();
        const row = await Promise.all(ph.slice(r,r+3).map(photoImg));
        row.forEach((im,k)=>{
          const x=M+k*(CW+GAP); cx.fillStyle="#eee"; cx.fillRect(x,y,CW,CW);
          if(im){ const s=Math.min(CW/im.width,CW/im.height), w=im.width*s, h=im.height*s; cx.drawImage(im,x+(CW-w)/2,y+(CW-h)/2,w,h); }
          else { font(18,false); cx.fillStyle="#999"; cx.fillText("写真を読み込めません",x+20,y+CW/2-10); }
          done++; prog(done,Math.max(nPh,1),`写真 ${done}/${nPh}枚`);
        });
        y+=CW+GAP;
      }
      y+=10; cx.fillStyle="#ddd"; cx.fillRect(M,y,W-2*M,2); y+=30;
      if(!ph.length) prog(n+1,list.length,`${n+1}/${list.length}件`);
    }
    flush();
    const fname = `廃棄記録_${pmode==="all"?"全期間":pmode==="ki"?kiName(pval)+(pmonth?`_${Math.floor(pmonth/100)}年${pmonth%100}月`:""):pmonth?`${Math.floor(pmonth/100)}年${pmonth%100}月`:pval+"年"}${q?"_検索":""}.pdf`;
    const blob = pdf.output("blob");
    const file = new File([blob], fname, {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    const canShare = (()=>{ try{ return navigator.canShare && navigator.canShare({files:[file]}); }catch(_){ return false; } })();
    pdfSheet(`<h2><span>PDFができました</span><button class="btn sm" id="pclose">閉じる</button></h2>
      <p class="hint">${esc(fname)}（${pageNo}ページ・${(blob.size/1048576).toFixed(1)}MB）</p>
      <div class="row">${canShare?`<button class="btn primary" id="pshare">保存・共有</button>`:""}<a class="btn ${canShare?"":"primary"}" href="${url}" download="${esc(fname)}" style="text-decoration:none">ダウンロード</a><a class="btn" href="${url}" target="_blank" rel="noopener" style="text-decoration:none">開く</a></div>
      ${canShare?`<p class="hint">スマホは「保存・共有」→「"ファイル"に保存」でPDFを保存できます。</p>`:""}`);
    $("#pclose").onclick = ()=>{ closeSheet(); setTimeout(()=>URL.revokeObjectURL(url),60000); };
    if($("#pshare")) $("#pshare").onclick = async ()=>{ try{ await navigator.share({files:[file], title:fname}); }catch(_){} };
  }catch(err){
    pdfSheet(`<h2><span>PDFを作れませんでした</span><button class="btn sm" id="pclose">閉じる</button></h2><p class="hint">${err.message==="load"?"PDFの部品を読み込めませんでした。電波を確認してもう一度押してください。":esc(err.message||"エラー")}</p>`);
    $("#pclose").onclick = closeSheet;
  }
};

/* ---------- 同期・更新 ---------- */
async function refresh(){ if(!pass||busy||!API_URL||$("#sheet-root").innerHTML) return;
  try{ await api("list"); setStatus(""); }catch(err){ if(err.code==="network"){ online=false; sync(); setStatus("通信できません。表示は前回のデータです。"); } else if(err.code!=="passcode") setStatus(`読み込めませんでした（${err.code}）`); } }
async function checkUpdate(){ try{
  const r = await fetch(location.pathname+"?v="+Date.now(), {cache:"no-store"}); const t = await r.text();
  const m = t.match(/const APP_VERSION = "([^"]+)"/);
  if(m && m[1]!==APP_VERSION && (busy || $("#sheet-root").innerHTML)){ setTimeout(checkUpdate,3000); return; }
  if(m && m[1]!==APP_VERSION) location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));
}catch(_){} }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ checkUpdate(); refresh(); } });
setInterval(()=>{ if(document.visibilityState==="visible") refresh(); }, 60000);

/* ---------- boot ---------- */
draw(); sync();
if(!API_URL) setStatus("データ側（Apps Script）の設定待ちです。設定が終わると使えるようになります。");
else if(!pass){ setStatus(""); showLock(); }
else { setStatus(items.length ? "" : "読み込み中…"); checkUpdate(); refresh(); }
})();
