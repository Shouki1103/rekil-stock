<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ReKiL ホーム">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="r-icon-180.png">
<title>ReKiL ホーム</title>
<style>
:root{--bg:#14181d;--surface:#1d232a;--line:#2f3740;--fg:#e8ebee;--muted:#9aa4af;--accent:#f2a541;--steel:#0d1014;--danger:#ff5d4d;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.brand i{display:inline-block;width:12px;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#1d2228 5px 10px);border-radius:2px}
.sync{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;font:inherit;font-size:12px}
main{max-width:640px;margin:0 auto;padding:10px 14px}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.todo h2{font-size:13px;color:var(--muted);margin:0 0 6px}
.todo a{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg);text-decoration:none;padding:6px 0;border-top:1px solid var(--line);font-size:14px;white-space:nowrap}
.todo a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.todo a:first-of-type{border-top:0}
.todo b{color:var(--danger);flex:0 0 auto}
.todo .ok{color:var(--muted);font-size:13px}
h3{font-size:13px;color:var(--muted);margin:16px 2px 8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.app img,.app .ph{width:58px;height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);object-fit:cover}
.app .ph{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--accent)}
.app span.n{font-size:11px;text-align:center;line-height:1.3;white-space:nowrap;letter-spacing:-.02em;max-width:calc(100% + 8px)}
.badge{position:absolute;top:-6px;left:calc(50% + 16px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.badge:empty{display:none}
.hint{font-size:12px;color:var(--muted)}.erow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}.erow .en{flex:1;min-width:0}.erow button,.erow select,.ebar button{font:inherit;font-size:14px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 10px}.erow select{max-width:130px}.ebar{margin-top:14px}#edit{border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.tk{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.tk:first-of-type{border-top:0}.tk input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}.tk.done span{opacity:.45;text-decoration:line-through}.tk small{color:var(--danger);font-size:11px;margin-left:auto;flex:0 0 auto}.tk small.cdone{color:var(--accent)}
#today summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}#today summary::-webkit-details-marker{display:none}#today summary::after{content:"▾ 開く";font-size:12px;color:var(--muted)}#today[open] summary::after{content:"▴ 閉じる"}#today summary h2{margin:0}#today[open] summary{margin-bottom:6px}
header{gap:8px}.brand{white-space:nowrap;flex:0 0 auto}.hctl{display:flex;align-items:center;gap:6px;min-width:0}.hctl .sync{white-space:nowrap}
.warnline{font-size:12px;color:var(--muted);padding:6px 0 0;border-top:1px solid var(--line);margin-top:4px}
</style>
</head>
<body>
<script>/* rekil-common */</script>

<header><div class="brand"><i></i>ReKiL ホーム</div><div class="hctl"><button class="sync" id="sync" type="button">確認中…</button><button class="sync" id="edit" type="button">並べ替え</button></div></header>
<main>
  <details class="todo" id="today"><summary><h2 id="todayTitle">今日やること</h2></summary><div id="todayList"><span class="ok">読み込み中…</span></div></details>
  <section class="todo" id="todo"><h2>未対応</h2><div id="todoList"><span class="ok">確認中…</span></div></section>
  <div id="groups"></div>
</main>
<script>
const APP_VERSION = "2026-11-19-5";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const getPass = (...keys) => { try{ for(const k of [...keys,"rekil-pass","rekil-shiire-pass"]){ const v = localStorage.getItem(k); if(v) return v; } }catch(_){} return ""; };

/* アプリ一覧は apps.json（新しいアプリを作ったらそこに追加） */
let CATALOG = {groups:[]};
try{ CATALOG = JSON.parse(localStorage.getItem("rekil-home-catalog")||'{"groups":[]}'); }catch(_){}
let layout = null; try{ layout = JSON.parse(localStorage.getItem("rekil-home-layout")||"null"); }catch(_){}
let editing = false;
const isOwner = () => { try{ return !!localStorage.getItem("rekil-kyuyo-pass"); }catch(_){ return false; } };
const HIDDEN = "使わない";
const allApps = () => { const m = {}, own = isOwner(); CATALOG.groups.forEach(g=>g.apps.forEach(a=>{ if(a.owner && !own) return; m[a.id]={...a, g:g.name}; })); return m; };
/* 自分で並べ替えた配置に、新しく増えたアプリを元のグループの最後に足す */
function groupsView(){
  const A = allApps(); const base = layout && layout.groups ? JSON.parse(JSON.stringify(layout.groups)) : CATALOG.groups.map(g=>({name:g.name, ids:g.apps.map(a=>a.id)}));
  const seen = new Set();
  base.forEach(g=>{ g.ids = g.ids.filter(id=>A[id] && !seen.has(id) && seen.add(id)); });
  Object.values(A).forEach(a=>{ if(seen.has(a.id)) return; let g = base.find(x=>x.name===a.g); if(!g){ g = {name:a.g, ids:[]}; base.push(g); } g.ids.push(a.id); seen.add(a.id); });
  return base;
}
const saveLayout = gs => { layout = {groups: gs}; try{ localStorage.setItem("rekil-home-layout", JSON.stringify(layout)); }catch(_){} };
async function loadCatalog(){
  try{ const r = await fetch("apps.json?v="+Date.now(), {cache:"no-store"}); const j = await r.json(); if(j && j.groups){ CATALOG = j; localStorage.setItem("rekil-home-catalog", JSON.stringify(j)); render(); } }catch(_){}
}
const badges = JSON.parse((()=>{ try{ return localStorage.getItem("rekil-home-badges") || "{}"; }catch(_){ return "{}"; } })());
const items = {};

function render(){
  const A = allApps(), gs = groupsView();
  if(!editing){
    $("#groups").innerHTML = gs.filter(g=>g.ids.length && g.name!==HIDDEN).map(g=>`<h3>${esc(g.name)}</h3><div class="grid">${g.ids.map(id=>{ const a = A[id];
      return `<a class="app" href="${esc(a.url)}"${/^https?:/.test(a.url)?' target="_blank" rel="noopener"':''}><img src="${esc(a.icon||"x")}" alt="" onerror="this.outerHTML='<span class=ph>${esc(a.name.slice(0,1))}</span>'"><span class="badge">${a.badge && badges[a.badge] ? badges[a.badge] : ""}</span><span class="n"${[...a.name].length>6?` style="font-size:${[...a.name].length>7?9.5:10}px"`:""}>${esc(a.name)}</span></a>`; }).join("")}</div>`).join("");
  }else{
    const names = gs.map(g=>g.name);
    $("#groups").innerHTML = `<p class="hint">↑↓で順番、右のプルダウンでグループを変えられます。「使わない」にしたアプリはホームに出なくなります（ここから戻せます）。この端末に保存されます。</p>` + gs.map((g,gi)=>`<h3>${esc(g.name)}</h3>${g.ids.map((id,i)=>`<div class="erow"><span class="en">${esc(A[id].name)}</span>
      <button data-mv="${gi},${i},-1" ${i===0?"disabled":""}>↑</button><button data-mv="${gi},${i},1" ${i===g.ids.length-1?"disabled":""}>↓</button>
      <select data-grp="${gi},${i}">${names.map((n,k)=>`<option value="${k}" ${k===gi?"selected":""}>${esc(n)}</option>`).join("")}${g.name===HIDDEN?"":`<option value="hide">使わない（非表示にする）</option>`}<option value="new">＋新しいグループ</option></select></div>`).join("") || '<p class="hint">（アプリなし）</p>'}`).join("")
      + `<div class="ebar"><button id="reset" type="button">最初の並びに戻す</button> ${isOwner() ? `<button id="ownerOff" type="button">この端末のログインを解除</button>` : `<button id="ownerOn" type="button">代表ログイン</button>`}</div>`;
  }
  if(!isOwner()) editing = false;
  $("#edit").textContent = !isOwner() ? "🔒" : editing ? "完了" : "並べ替え";
  $("#edit").setAttribute("aria-label", isOwner() ? "並べ替え" : "代表ログイン");
  const list = Object.values(items).flat();
  $("#todoList").innerHTML = (list.length ? list.map(x=>`<a href="${esc(x.u)}"><span>${esc(x.t)}</span><b>${esc(x.v)}</b></a>`).join("") : '<span class="ok">未対応はありません</span>')
    + (typeof failed!=="undefined" && failed.length ? `<div class="warnline">確認できなかったアプリ：${failed.map(esc).join("、")}<br><button type="button" class="sync" id="setPass" style="border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-top:6px">社内の暗証番号を入れる</button></div>` : "");
}
$("#groups").addEventListener("click", e=>{
  const m = e.target.closest("[data-mv]"); if(m){ const [gi,i,d] = m.dataset.mv.split(",").map(Number); const gs = groupsView(); const ids = gs[gi].ids; [ids[i], ids[i+d]] = [ids[i+d], ids[i]]; saveLayout(gs); render(); return; }
  if(e.target.id==="ownerOn"){ ownerUnlock(); return; }
  if(e.target.id==="ownerOff"){ try{ localStorage.removeItem("rekil-kyuyo-pass"); localStorage.removeItem("rekil-account-pass"); }catch(_){} editing = false; render(); return; }
  if(e.target.id==="reset"){ layout = null; try{ localStorage.removeItem("rekil-home-layout"); }catch(_){} render(); }
});
$("#groups").addEventListener("change", e=>{
  const s = e.target.closest("[data-grp]"); if(!s) return; const [gi,i] = s.dataset.grp.split(",").map(Number); const gs = groupsView();
  let to = s.value; if(to==="hide"){ let k = gs.findIndex(x=>x.name===HIDDEN); if(k<0){ gs.push({name:HIDDEN, ids:[]}); k = gs.length-1; } to = k; } else if(to==="new"){ const n = prompt("新しいグループ名"); if(!n){ render(); return; } gs.push({name:n.trim(), ids:[]}); to = gs.length-1; }
  const [id] = gs[gi].ids.splice(i,1); gs[+to].ids.push(id); saveLayout(gs); render();
});


/* 今日やること（tasks.json）。終わった分（チェック・Claude済）はすぐ消え、未完了の分は翌日以降も残る */
let TASKS = []; try{ TASKS = JSON.parse(localStorage.getItem("rekil-home-tasks")||"[]"); }catch(_){}
let tdone = {}; try{ tdone = JSON.parse(localStorage.getItem("rekil-home-tdone")||"{}"); }catch(_){}
async function loadTasks(){ try{ const r = await fetch("tasks.json?v="+Date.now(), {cache:"no-store"}); const j = await r.json(); if(j && j.tasks){ TASKS = j.tasks; localStorage.setItem("rekil-home-tasks", JSON.stringify(TASKS)); renderToday(); } }catch(_){} }
/* Claudeが済ませた作業（done.json）。全端末共通で完了扱い */
let SDONE = {}; try{ SDONE = JSON.parse(localStorage.getItem("rekil-home-sdone")||"{}"); }catch(_){}
async function loadDone(){ try{ const r = await fetch("done.json?v="+Date.now(), {cache:"no-store"}); const j = await r.json(); if(j && j.done){ SDONE = j.done; localStorage.setItem("rekil-home-sdone", JSON.stringify(SDONE)); renderToday(); } }catch(_){} }
const isDone = key => !!(tdone[key] || SDONE[key]);
function dueKeys(){
  const t = new Date(Date.now()+9*3600e3), y = t.getUTCFullYear(), m = t.getUTCMonth(), d = t.getUTCDate(), dow = t.getUTCDay();
  const last = new Date(Date.UTC(y, m+1, 0)).getUTCDate(), ym = `${y}-${String(m+1).padStart(2,"0")}`, td = `${ym}-${String(d).padStart(2,"0")}`;
  const out = [];
  TASKS.forEach(k=>{
    if(k.daily) out.push({k, key:`${k.id}@${td}`, late:false});
    else if(k.dow!=null){ if(k.dow===dow) out.push({k, key:`${k.id}@${td}`, late:false}); }
    else { const day = k.day==="end" ? last : +k.day; if(day<=d) out.push({k, key:`${k.id}@${ym}`, late: day<d}); }
  });
  return out;
}
function renderToday(){
  const list = dueKeys().filter(x=>!isDone(x.key));
  const left = list.filter(x=>!isDone(x.key)).length;
  $("#todayTitle").textContent = `今日やること（残り${left}件）`;
  $("#todayList").innerHTML = list.length ? list.sort((a,b)=>isDone(a.key)-isDone(b.key) || (b.late-a.late)).map(x=>`<label class="tk ${isDone(x.key)?"done":""}"${SDONE[x.key]?` title="${esc(SDONE[x.key])}"`:""}><input type="checkbox" data-tk="${esc(x.key)}" ${isDone(x.key)?"checked":""} ${SDONE[x.key]?"disabled":""}><span>${esc(x.k.t)}</span>${x.late&&!isDone(x.key)?"<small>未対応</small>":""}${SDONE[x.key]?'<small class="cdone">Claude済</small>':""}</label>`).join("") : `<span class="ok">${dueKeys().length?"今日の作業はすべて完了しました":"今日の定期作業はありません"}</span>`;
}
$("#todayList").addEventListener("change", e=>{ const c = e.target.closest("[data-tk]"); if(!c) return; if(c.checked) tdone[c.dataset.tk] = 1; else delete tdone[c.dataset.tk];
  try{ localStorage.setItem("rekil-home-tdone", JSON.stringify(tdone)); }catch(_){} renderToday(); });
const needPass = k => { const v = getPass(k); if(!v) throw new Error("nopass"); return v; };

/* 代表ログイン：一度ログインした端末では、ずっと代表用の表示（給与など）になる */
async function ownerUnlock(){
  const v = prompt("代表ログイン"); if(!v) return;
  try{
    const r = await fetch("https://script.google.com/macros/s/AKfycbwNWiqaeTw23PfypT3TgOCv5yzfKzFbipU4u9-N8RqWFOFwLfzuaNQdL6oO3yKhytNZ4g/exec", {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action:"load", pass:v.trim()})});
    const j = await r.json();
    if(!j.ok){ alert("ログインできませんでした"); return; }
    localStorage.setItem("rekil-kyuyo-pass", v.trim()); render(); alert("ログインしました。この端末ではこのままずっと使えます");
  }catch(_){ alert("通信できませんでした。もう一度お試しください"); }
}
async function call(url, pass, action="list"){
  const res = await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action, pass})});
  const j = await res.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
}
const SRC_NAME = {okurijo:"送り状控え", henpin:"出品・返品・外注", shitami:"下見・指値", irai:"eBay出品依頼"};
const failed = [];
const SRC = {
  okurijo: async () => {
    const j = await call("https://script.google.com/macros/s/AKfycbwa-V3TqAAmz3S1-zreAI3Jkp0d4f0aGikswIQnTdmxsgFpggUxE0bjl1-sR0DZumSwsQ/exec", needPass("rekil-okuri-pass"));
    const rows = j.rows || []; const c = {ebay:0, yahoo:0, gyohan:0}; rows.forEach(r=>{ if(!r.done && c[r.channel]!=null) c[r.channel]++; });
    const n = c.ebay+c.yahoo+c.gyohan;
    return {n, items: n ? [{t:`送り状の未登録（${[["eBay",c.ebay],["ヤフオク",c.yahoo],["業販",c.gyohan]].filter(x=>x[1]).map(x=>x[0]+" "+x[1]).join("・")}）`, v:`${n}件`, u:"../okurijo/"}] : []};
  },
  henpin: async () => {
    const j = await call("https://script.google.com/macros/s/AKfycbzuakHA841y3KMQTn32E6L6UOebKO9LZGEqX1IHAAQ3Xkb5Y2tvp4ZlIOVnr1u9T5KD/exec", needPass("rekil-henpin-pass"));
    const d = j.data || {}, t = today();
    const closed = {shuppin:["保留処理済み","保留なし"], shiire:["返金済み","返品不可"], frima:["返金完了","返品不可"], repair:["受取済み"]};
    const name = {shuppin:"業者出品の保留処理", shiire:"仕入返品", frima:"フリマ返品", repair:"リペアの受取"};
    const out = []; let n = 0;
    Object.keys(closed).forEach(k=>{ const over = (d[k]||[]).filter(r=>{ if(closed[k].includes(r.status)) return false;
      const due = k==="shuppin" ? r.kaisai : k==="repair" ? r.due : r.deadline; return due && due < t; }).length;
      if(over){ n += over; out.push({t:`${name[k]}が期限超え`, v:`${over}件`, u:"../henpin/"}); } });
    return {n, items: out};
  },
  shitami: async () => {
    const j = await call("https://script.google.com/macros/s/AKfycbw7kz9QQt6CMQvwIC4IhtSekntc4xGCUAWuop6U7LO_3U6FMRo--X6wKI0F6hSx3n3Vng/exec", needPass("rekil-shitami-pass"));
    const t = today(); const n = ((j.data||{}).items||[]).filter(i=>i.status!=="bid" && (!i.date || i.date >= t)).length;
    return {n, items: n ? [{t:"指値の登録待ち", v:`${n}件`, u:"../shitami/"}] : []};
  },
  irai: async () => {
    const j = await call("https://script.google.com/macros/s/AKfycbyt_sbyLWtGgD8TODNx7kvs2gEOlisN6X8XWqFYGyVQVHkmqvrIRTo6RWZXgYSPjRCB/exec", needPass("rekil-irai-pass"));
    const n = (j.requests||[]).filter(r=>r.status!=="done").length;
    return {n, items: n ? [{t:"eBay下書きの未作成・修正待ち", v:`${n}件`, u:"../irai/"}] : []};
  },
};
async function refresh(){
  $("#sync").textContent = "確認中…";
  failed.length = 0;
  await Promise.all(Object.entries(SRC).map(async ([k,f])=>{
    try{ const r = await f(); badges[k] = r.n || 0; items[k] = r.items; }catch(e){ failed.push(SRC_NAME[k] + (e.message==="nopass"||e.message==="passcode" ? "（暗証番号）" : "（通信）")); }
  }));
  try{ localStorage.setItem("rekil-home-badges", JSON.stringify(badges)); localStorage.setItem("rekil-home-items", JSON.stringify(items)); }catch(_){}
  const d = new Date(); $("#sync").textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")} ↻`;
  render();
}
try{ Object.assign(items, JSON.parse(localStorage.getItem("rekil-home-items")||"{}")); }catch(_){}
try{ sessionStorage.setItem("rekil-from-home","1"); }catch(_){}
render(); renderToday(); loadCatalog(); loadTasks(); loadDone(); refresh();
$("#sync").onclick = refresh;
document.addEventListener("click", e=>{ if(e.target.id!=="setPass") return; const v = prompt("社内の暗証番号（ReKiL Stockなどと同じ番号）。一度入れると、ホームから開くアプリで入力不要になります"); if(!v) return; try{ localStorage.setItem("rekil-pass", v.trim()); }catch(_){} refresh(); });
$("#edit").onclick = ()=>{ if(!isOwner()){ ownerUnlock(); return; } editing = !editing; render(); };
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ checkUpdate(); refresh(); } });
async function checkUpdate(){ try{ const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}); const t=await r.text(); const m=t.match(/const APP_VERSION = "([^"]+)"/); if(m && m[1]!==APP_VERSION) location.replace(location.pathname+"?v="+encodeURIComponent(m[1])); }catch(_){} }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ loadCatalog(); loadTasks(); loadDone(); renderToday(); } });
if(location.protocol.startsWith("http")){ checkUpdate(); setInterval(()=>{ if(document.visibilityState==="visible") checkUpdate(); }, 60000); }
try{history.scrollRestoration="manual"}catch(_){} addEventListener("pageshow",()=>scrollTo(0,0));
</script>
