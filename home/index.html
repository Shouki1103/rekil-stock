<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ReKiL ホーム">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="r-icon-180.png">
<title>ReKiL ホーム</title>
<style>
:root{--bg:#14181d;--surface:#1d232a;--line:#2f3740;--fg:#e8ebee;--muted:#9aa4af;--accent:#f2a541;--steel:#0d1014;--danger:#ff5d4d;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
header{position:relative;flex:0 0 auto;z-index:5;background:var(--steel);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.brand i{display:inline-block;width:12px;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#1d2228 5px 10px);border-radius:2px}
.sync{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;font:inherit;font-size:12px}
main{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px max(14px,calc((100% - 612px)/2)) calc(24px + env(safe-area-inset-bottom,0px))}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.todo h2{font-size:13px;color:var(--muted);margin:0 0 6px}
.todo a{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg);text-decoration:none;padding:6px 0;border-top:1px solid var(--line);font-size:14px;white-space:nowrap}
.todo a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.todo a:first-of-type{border-top:0}
.todo b{color:var(--danger);flex:0 0 auto}
.todo .ok{color:var(--muted);font-size:13px}
h3{font-size:13px;color:var(--muted);margin:16px 2px 8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.app img,.app .ph{width:58px;height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);object-fit:cover}
.app .ph{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--accent)}
.app span.n{font-size:11px;text-align:center;line-height:1.3;white-space:nowrap;letter-spacing:-.02em;max-width:calc(100% + 8px)}
.badge{position:absolute;top:-6px;left:calc(50% + 16px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.badge:empty{display:none}
.hint{font-size:12px;color:var(--muted)}.erow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}.erow .en{flex:1;min-width:0}.erow button,.erow select,.ebar button{font:inherit;font-size:14px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 10px}.erow select{max-width:130px}.ebar{margin-top:14px}#edit{border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.tk{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.tk:first-of-type{border-top:0}.tk input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}.tk.done span{opacity:.45;text-decoration:line-through}.tk small{color:var(--danger);font-size:11px;margin-left:auto;flex:0 0 auto}.tk small.cdone{color:var(--accent)}
#today summary,#todo summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}#today summary::-webkit-details-marker,#todo summary::-webkit-details-marker{display:none}#today summary::after,#todo summary::after{content:"▾ 開く";font-size:12px;color:var(--muted)}#today[open] summary::after,#todo[open] summary::after{content:"▴ 閉じる"}#today summary h2,#todo summary h2{margin:0}#today[open] summary,#todo[open] summary{margin-bottom:6px}
header{gap:8px}.brand{white-space:nowrap;flex:0 0 auto}.hctl{display:flex;align-items:center;gap:6px;min-width:0}.hctl .sync{white-space:nowrap}
.tabs{flex:0 0 auto;display:flex;gap:6px;padding:8px max(14px,calc((100% - 612px)/2)) 0;background:var(--bg)}.tabs button{flex:1;font:inherit;font-size:14px;font-weight:700;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}.tabs button.on{background:var(--accent);color:#14181d;border-color:var(--accent)}
.lk{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}.lk:first-of-type{border-top:0}.lk .t{flex:1;min-width:0}.lk .t b{color:var(--fg);display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk em{font-style:normal;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);flex:0 0 auto}.lk em.claude{color:#c9a7ff}.lk em.sheet{color:#7fd38a}.lk .cp{font:inherit;font-size:12px;min-height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 8px;flex:0 0 auto}
.lbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}.lbar button{font:inherit;font-size:13px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 10px}.lbar button.del{border-color:#e5483a;color:#e5483a}.lbar .n{font-size:13px;font-weight:700;margin-right:auto}.lk input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;accent-color:var(--accent)}.lk .vis{font:inherit;font-size:11.5px;min-height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 8px;flex:0 0 auto}.lk .vis.own{border-color:var(--accent);color:var(--accent)}.lk .lock{font-size:11px;color:var(--accent);flex:0 0 auto}
.search{width:100%;font:inherit;font-size:16px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;margin-bottom:6px}
.fold{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;width:58px;height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.fold img,.fold span{width:100%;height:100%;border-radius:4px;object-fit:cover;background:var(--line)}
#fsheet{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}#fsheet[hidden]{display:none}#fsheet .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;width:min(360px,100%)}#fsheet h4{margin:0 0 12px;font-size:15px}
.tk .who{color:var(--muted);font-size:11px;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px}.kpis a{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-decoration:none;color:var(--fg)}.kpis span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}.kpis b{display:block;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}.kpis b.neg{color:var(--danger)}
.qbox{display:flex;gap:6px;margin-bottom:6px}.qbox input{flex:1;font:inherit;font-size:16px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px}
.news{display:block;font-size:12px;color:var(--muted);text-decoration:none;padding:2px 2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.news b{color:var(--accent);font-weight:700;margin-right:6px}
.warnline{font-size:12px;color:var(--muted);padding:6px 0 0;border-top:1px solid var(--line);margin-top:4px}
</style>
</head>
<body>
<script>/* rekil-common */</script>

<header><div class="brand"><i></i>ReKiL ホーム</div><div class="hctl"><button class="sync" id="sync" type="button">確認中…</button><button class="sync" id="edit" type="button">並べ替え</button></div></header>
<nav class="tabs"><button type="button" data-tab="apps">アプリ</button><button type="button" data-tab="links">リンク集</button></nav>
<main>
 <div id="vApps">
  <form class="qbox" id="qf" action="../search/"><input name="q" type="search" placeholder="全アプリから探す（管理番号・ブランド）" autocomplete="off"></form>
  <div class="kpis" id="kpis" hidden></div>
  <a class="news" id="news" href="../koushin/" hidden></a>
  <details class="todo" id="today"><summary><h2 id="todayTitle">今日やること</h2></summary><div id="todayList"><span class="ok">読み込み中…</span></div></details>
  <details class="todo" id="todo"><summary><h2 id="todoTitle">未対応</h2></summary><div id="todoList"><span class="ok">確認中…</span></div></details>
  <div id="groups"></div>
 </div>
 <div id="vLinks" hidden>
  <div class="lbar" id="lbar" hidden></div>
  <input class="search" id="lq" type="search" placeholder="リンクを探す（例：送り状、オークネット）" autocomplete="off">
  <div id="links"><span class="ok">読み込み中…</span></div>
 </div>
</main>
<div id="fsheet" hidden><div class="box"><h4 id="fname"></h4><div class="grid" id="fgrid"></div></div></div>
<script>
const APP_VERSION = "2026-11-27-1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const getPass = (...keys) => { try{ for(const k of [...keys,"rekil-pass","rekil-shiire-pass"]){ const v = localStorage.getItem(k); if(v) return v; } }catch(_){} return ""; };

/* アプリ一覧は apps.json（新しいアプリを作ったらそこに追加） */
let CATALOG = {groups:[]};
try{ CATALOG = JSON.parse(localStorage.getItem("rekil-home-catalog")||'{"groups":[]}'); }catch(_){}
let layout = null; try{ layout = JSON.parse(localStorage.getItem("rekil-home-layout")||"null"); }catch(_){}
let editing = false;
const isOwner = () => { try{ return !!localStorage.getItem("rekil-kyuyo-pass"); }catch(_){ return false; } };
const HIDDEN = "使わない";
const allApps = () => { const m = {}, own = isOwner(); CATALOG.groups.forEach(g=>g.apps.forEach(a=>{ if(a.owner && !own) return; m[a.id]={...a, g:g.name}; })); return m; };
const subApps = () => { const m = {}; (CATALOG.folderApps||[]).forEach(a=>m[a.id]=a); return m; };
const tileBadge = a => a.folder ? a.folder.reduce((s,id)=>{ const c = subApps()[id]; return s + (c && c.badge && +badges[c.badge] || 0); },0) || "" : (a.badge && badges[a.badge] ? badges[a.badge] : "");
const tileImg = a => a.folder ? `<span class="fold">${a.folder.slice(0,4).map(id=>{ const c = subApps()[id]; return c ? `<img src="${esc(c.icon)}" alt="" onerror="this.outerHTML='<span></span>'">` : "<span></span>"; }).join("")}</span>` : `<img src="${esc(a.icon||"x")}" alt="" onerror="this.outerHTML='<span class=ph>${esc(a.name.slice(0,1))}</span>'">`;
/* 自分で並べ替えた配置に、新しく増えたアプリを元のグループの最後に足す */
function groupsView(){
  const A = allApps(); const base = layout && layout.groups ? JSON.parse(JSON.stringify(layout.groups)) : CATALOG.groups.map(g=>({name:g.name, ids:g.apps.map(a=>a.id)}));
  const seen = new Set();
  base.forEach(g=>{ g.ids = g.ids.filter(id=>A[id] && !seen.has(id) && seen.add(id)); });
  Object.values(A).forEach(a=>{ if(seen.has(a.id)) return; let g = base.find(x=>x.name===a.g); if(!g){ g = {name:a.g, ids:[]}; base.push(g); } g.ids.push(a.id); seen.add(a.id); });
  return base;
}
const saveLayout = gs => { layout = {groups: gs}; try{ localStorage.setItem("rekil-home-layout", JSON.stringify(layout)); }catch(_){} };
async function loadCatalog(){
  try{ const r = await fetch("apps.json?v="+Date.now(), {cache:"no-store"}); const j = await r.json(); if(j && j.groups){ CATALOG = j; localStorage.setItem("rekil-home-catalog", JSON.stringify(j)); render(); } }catch(_){}
}
const badges = JSON.parse((()=>{ try{ return localStorage.getItem("rekil-home-badges") || "{}"; }catch(_){ return "{}"; } })());
const items = {};

function render(){
  const A = allApps(), gs = groupsView();
  if(!editing){
    $("#groups").innerHTML = gs.filter(g=>g.ids.length && g.name!==HIDDEN).map(g=>`<h3>${esc(g.name)}</h3><div class="grid">${g.ids.map(id=>{ const a = A[id];
      return `<a class="app" href="${a.folder?"#":esc(a.url)}"${a.folder?` data-folder="${esc(a.id)}"`:""}${/^https?:/.test(a.url||"")?' target="_blank" rel="noopener"':''}>${tileImg(a)}<span class="badge">${tileBadge(a)}</span><span class="n"${[...a.name].length>6?` style="font-size:${[...a.name].length>7?9.5:10}px"`:""}>${esc(a.name)}</span></a>`; }).join("")}</div>`).join("");
  }else{
    const names = gs.map(g=>g.name);
    $("#groups").innerHTML = `<p class="hint">↑↓で順番、右のプルダウンでグループを変えられます。「使わない」にしたアプリはホームに出なくなります（ここから戻せます）。この端末に保存されます。</p>` + gs.map((g,gi)=>`<h3>${esc(g.name)}</h3>${g.ids.map((id,i)=>`<div class="erow"><span class="en">${esc(A[id].name)}</span>
      <button data-mv="${gi},${i},-1" ${i===0?"disabled":""}>↑</button><button data-mv="${gi},${i},1" ${i===g.ids.length-1?"disabled":""}>↓</button>
      <select data-grp="${gi},${i}">${names.map((n,k)=>`<option value="${k}" ${k===gi?"selected":""}>${esc(n)}</option>`).join("")}${g.name===HIDDEN?"":`<option value="hide">使わない（非表示にする）</option>`}<option value="new">＋新しいグループ</option></select></div>`).join("") || '<p class="hint">（アプリなし）</p>'}`).join("")
      + `<div class="ebar"><button id="reset" type="button">最初の並びに戻す</button> ${isOwner() ? `<button id="ownerOff" type="button">この端末のログインを解除</button>` : `<button id="ownerOn" type="button">代表ログイン</button>`}</div>`;
  }
  if(!isOwner()) editing = false;
  $("#edit").textContent = !isOwner() ? "🔒" : editing ? "完了" : "並べ替え";
  $("#edit").setAttribute("aria-label", isOwner() ? "並べ替え" : "代表ログイン");
  const list = Object.values(items).flat();
  { const n = list.reduce((s,x)=>s+(parseInt(x.v)||1),0); $("#todoTitle").innerHTML = list.length ? `未対応（${n}件）` : "未対応（なし）"; }
  $("#todoList").innerHTML = (list.length ? list.map(x=>`<a href="${esc(x.u)}"><span>${esc(x.t)}</span><b>${esc(x.v)}</b></a>`).join("") : '<span class="ok">未対応はありません</span>')
    + (typeof failed!=="undefined" && failed.length ? `<div class="warnline">確認できなかったアプリ：${failed.map(esc).join("、")}<br><button type="button" class="sync" id="setPass" style="border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-top:6px">社内の暗証番号を入れる</button></div>` : "");
}
$("#groups").addEventListener("click", e=>{
  const m = e.target.closest("[data-mv]"); if(m){ const [gi,i,d] = m.dataset.mv.split(",").map(Number); const gs = groupsView(); const ids = gs[gi].ids; [ids[i], ids[i+d]] = [ids[i+d], ids[i]]; saveLayout(gs); render(); return; }
  if(e.target.id==="ownerOn"){ ownerUnlock(); return; }
  if(e.target.id==="ownerOff"){ try{ localStorage.removeItem("rekil-kyuyo-pass"); localStorage.removeItem("rekil-account-pass"); }catch(_){} editing = false; render(); return; }
  if(e.target.id==="reset"){ layout = null; try{ localStorage.removeItem("rekil-home-layout"); }catch(_){} render(); }
});
$("#groups").addEventListener("change", e=>{
  const s = e.target.closest("[data-grp]"); if(!s) return; const [gi,i] = s.dataset.grp.split(",").map(Number); const gs = groupsView();
  let to = s.value; if(to==="hide"){ let k = gs.findIndex(x=>x.name===HIDDEN); if(k<0){ gs.push({name:HIDDEN, ids:[]}); k = gs.length-1; } to = k; } else if(to==="new"){ const n = prompt("新しいグループ名"); if(!n){ render(); return; } gs.push({name:n.trim(), ids:[]}); to = gs.length-1; }
  const [id] = gs[gi].ids.splice(i,1); gs[+to].ids.push(id); saveLayout(gs); render();
});


/* 今日やること（tasks.json）。終わった分（チェック・Claude済）はすぐ消え、未完了の分は翌日以降も残る */
let TASKS = []; try{ TASKS = JSON.parse(localStorage.getItem("rekil-home-tasks")||"[]"); }catch(_){}
let tdone = {}; try{ tdone = JSON.parse(localStorage.getItem("rekil-home-tdone")||"{}"); }catch(_){}
async function loadTasks(){ try{ const r = await fetch("tasks.json?v="+Date.now(), {cache:"no-store"}); const j = await r.json(); if(j && j.tasks){ TASKS = j.tasks; localStorage.setItem("rekil-home-tasks", JSON.stringify(TASKS)); renderToday(); } }catch(_){} }
/* Claudeが済ませた作業（done.json）。全端末共通で完了扱い */
let SDONE = {}; try{ SDONE = JSON.parse(localStorage.getItem("rekil-home-sdone")||"{}"); }catch(_){}
async function loadDone(){ try{ const r = await fetch("done.json?v="+Date.now(), {cache:"no-store"}); const j = await r.json(); if(j && j.done){ SDONE = j.done; localStorage.setItem("rekil-home-sdone", JSON.stringify(SDONE)); renderToday(); } }catch(_){} }
const isDone = key => !!(tdone[key] || SDONE[key]);
function dueKeys(){
  const t = new Date(Date.now()+9*3600e3), y = t.getUTCFullYear(), m = t.getUTCMonth(), d = t.getUTCDate(), dow = t.getUTCDay();
  const last = new Date(Date.UTC(y, m+1, 0)).getUTCDate(), ym = `${y}-${String(m+1).padStart(2,"0")}`, td = `${ym}-${String(d).padStart(2,"0")}`;
  const out = [];
  TASKS.forEach(k=>{
    if(k.daily) out.push({k, key:`${k.id}@${td}`, late:false});
    else if(k.dow!=null){ if(k.dow===dow) out.push({k, key:`${k.id}@${td}`, late:false}); }
    else { const day = k.day==="end" ? last : +k.day; if(day<=d) out.push({k, key:`${k.id}@${ym}`, late: day<d}); }
  });
  return out;
}
function renderToday(){
  const list = dueKeys().filter(x=>!isDone(x.key));
  const left = list.filter(x=>!isDone(x.key)).length;
  const rl = renList();
  $("#todayTitle").textContent = `今日やること（残り${left + rl.length}件）`;
  $("#todayList").innerHTML = list.length ? list.sort((a,b)=>isDone(a.key)-isDone(b.key) || (b.late-a.late)).map(x=>`<label class="tk ${isDone(x.key)?"done":""}"${SDONE[x.key]?` title="${esc(SDONE[x.key])}"`:""}><input type="checkbox" data-tk="${esc(x.key)}" ${isDone(x.key)?"checked":""} ${SDONE[x.key]?"disabled":""}><span>${esc(x.k.t)}</span>${x.late&&!isDone(x.key)?"<small>未対応</small>":""}${SDONE[x.key]?'<small class="cdone">Claude済</small>':""}</label>`).join("") : (rl.length ? "" : `<span class="ok">${dueKeys().length?"今日の作業はすべて完了しました":"今日の定期作業はありません"}</span>`);
  $("#todayList").insertAdjacentHTML("beforeend", rl.map(x=>`<label class="tk"><input type="checkbox" data-ren="${esc(x.id)}"><span>${esc(x.title)}<span class="who">連絡・${esc(x.assignee||"誰でも")}</span></span>${x.due && x.due < today() ? "<small>期限超過</small>" : ""}</label>`).join(""));
}
$("#todayList").addEventListener("change", e=>{ const r = e.target.closest("[data-ren]");
  if(r){ const x = REN.find(y=>y.id===r.dataset.ren); if(!x) return; x.done = "1"; x.doneAt = new Date().toISOString(); try{ localStorage.setItem("renraku-tasks", JSON.stringify(REN)); }catch(_){} renderToday();
    fetch(REN_API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action:"doneTask", pass:getPass("rekil-renraku-pass"), id:x.id, done:true, by:renMe()||"ホーム"})}).catch(()=>{ x.done=""; renderToday(); alert("連絡アプリに保存できませんでした"); }); return; }
  const c = e.target.closest("[data-tk]"); if(!c) return; if(c.checked) tdone[c.dataset.tk] = 1; else delete tdone[c.dataset.tk];
  try{ localStorage.setItem("rekil-home-tdone", JSON.stringify(tdone)); }catch(_){} renderToday(); });

  const sale = sold.reduce((s,r)=>s+(+r[8]||0),0), pf = sold.reduce((s,r)=>s+(+r[11]||0),0), buy = rows.filter(r=>String(r[4]||"").slice(0,7)===ym).reduce((s,r)=>s+(+r[2]||0),0);
  const old = inv.filter(r=>{ const d = Date.parse(r[4]); return d && (t0-d)/864e5 >= 180; }).length;
  const man = v => v>=1e6 ? (v/1e4).toFixed(0)+"万" : Math.round(v).toLocaleString();
  $("#kpis").innerHTML = [["今月の売上", man(sale)+"円"],["今月の粗利", man(pf)+"円", pf<0],["今月の仕入", man(buy)+"円"],["今月の販売", sold.length+"点"],["在庫（出品中）", inv.length.toLocaleString()+"点"],["滞留180日超", old+"点", old>0]]
    .map(([l,v,n])=>`<a href="../dash/"><span>${l}</span><b class="${n?"neg":""}">${v}</b></a>`).join("");
  const at = c.at ? new Date(c.at) : null;
  $("#kpis").insertAdjacentHTML("beforeend", `<div style="grid-column:1/-1;font-size:11px;color:var(--muted);text-align:right">${at ? `在庫/売上管理シートの ${at.getMonth()+1}/${at.getDate()} ${at.getHours()}:${String(at.getMinutes()).padStart(2,"0")} 時点の数字` : "前回読み込んだ数字"}（↻で更新）</div>`);
  $("#kpis").hidden = false;
}
