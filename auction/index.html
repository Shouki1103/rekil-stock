<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オークション">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>業者オークション</title>
<style>:root{--bg:#14181d;--surface:#1d232a;--line:#2f3740;--fg:#e8ebee;--muted:#9aa4af;--accent:#f2a541;--steel:#0d1014;--danger:#ff5d4d;--ok:#5fcf7a;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg);color:var(--fg);margin:0}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{flex:0 0 auto;background:var(--steel);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;white-space:nowrap}
.brand i{display:inline-block;width:12px;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#1d2228 5px 10px);border-radius:2px}
.hb{font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.tabs{flex:0 0 auto;display:flex;gap:6px;padding:8px max(14px,calc((100% - 640px)/2)) 0;overflow-x:auto}
.tabs button{flex:1 0 auto;font:inherit;font-size:14px;font-weight:700;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0 12px}
.tabs button.on{background:var(--accent);color:#14181d;border-color:var(--accent)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px max(14px,calc((100% - 640px)/2)) calc(90px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card h2{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:700}
h3{font-size:13px;color:var(--muted);margin:16px 2px 8px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14px;font-weight:600}.row .t small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.tag.a{color:#14181d;background:var(--accent);border-color:var(--accent)}.tag.r{color:#fff;background:var(--danger);border-color:var(--danger)}.tag.g{color:#14181d;background:var(--ok);border-color:var(--ok)}
.btn{font:inherit;font-size:14px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;cursor:pointer}
.btn.p{background:var(--accent);color:#14181d;border-color:var(--accent);font-weight:700}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 12px}
textarea{min-height:90px}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.chips button{font:inherit;font-size:13px;min-height:32px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0 12px}.chips button.on{background:var(--accent);color:#14181d;border-color:var(--accent)}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 0 10px}.mcal .wh{font-size:11px;color:var(--muted);text-align:center}.mcal button{font:inherit;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;font-size:13px}.mcal button:disabled{opacity:.35;background:transparent}.mcal button.td{border-color:var(--accent);color:var(--accent);font-weight:800}.mcal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}.mcal .dots i{width:6px;height:6px;border-radius:3px;background:var(--accent)}.mcal .dots i.p{background:transparent;border:1px solid var(--muted)}.mcal .mo{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}.card.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;transition:box-shadow .3s}.fsel{margin:4px 0 8px}#toTop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:65;min-height:44px;border-radius:22px;border:0;background:var(--accent);color:#14181d;font:inherit;font-weight:800;font-size:14px;padding:0 18px;box-shadow:0 4px 16px #0008}#toTop[hidden]{display:none}.ymbar{display:flex;gap:6px;align-items:center;margin:0 0 8px}.ymbar select{flex:1}.ymbar .btn{min-width:44px;padding:0 10px}.ymbar .btn[hidden]{display:none}.mcal button.past{opacity:.6}.card.pastc{opacity:.75}
.muted{color:var(--muted);font-size:12px}.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
.sheet{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheet .box{background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:min(640px,100%);max-height:90%;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:90}.toast.show{opacity:1}
a{color:var(--accent)}
</style>
</head>
<body>
<script>/* rekil-common */</script>
<header><div class="brand"><i></i>業者オークション</div><div><button class="hb" id="setBtn" type="button">表示設定</button></div></header>
<nav class="tabs"><button type="button" data-tab="cal">開催カレンダー</button><button type="button" data-tab="shitami">下見・指値</button><button type="button" data-tab="soba">相場振り返り</button></nav>
<main>

<section data-view="cal">
  <select class="fsel" id="fil" aria-label="業者で絞り込み"></select>
  <div class="ymbar"><button type="button" class="btn" id="ymPrev" aria-label="前の月">‹</button><select id="ym" aria-label="表示する月"></select><button type="button" class="btn" id="ymNext" aria-label="次の月">›</button><button type="button" class="btn" id="ymNow">今月</button></div>
  <div class="mcal" id="mcal"></div>
  <div id="cal"></div>
  <p class="muted" id="note"></p>
</section>
<section data-view="shitami" hidden>
  <div class="card"><h2>下見・指値の状況</h2><div id="st"><span class="muted">読み込み中…</span></div>
  <p style="margin:10px 0 0"><a class="btn p" style="display:inline-flex;align-items:center;text-decoration:none" href="../shitami/">下見・指値アプリを開く ›</a></p></div>
  <h3>これから下見できるオークション（7日以内）</h3><div id="soon"></div>
</section>
<section data-view="soba" hidden>
  <p class="muted">開催後、相場表に反映されたら振り返ります。終わったらチェック（この端末に保存）。</p>
  <div id="soba"></div>
</section>
<div class="sheet" id="set" hidden><div class="box"><h3 style="margin-top:0">表示するオークション</h3><div id="setList"></div><p><button class="btn p" id="setOk" type="button">閉じる</button></p></div></div>

</main>
<button type="button" id="toTop" hidden>▲ カレンダーに戻る</button>
<script>
const APP_VERSION = "2026-11-27-13";

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(_){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} } };
const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const W = "日月火水木金土";
const md = d => { const x = new Date(d+"T00:00:00Z"); return `${x.getUTCMonth()+1}/${x.getUTCDate()}(${W[x.getUTCDay()]})`; };
const yen = n => (Math.round(+n||0)).toLocaleString("ja-JP") + "円";
function toast(t){ let el = $("#toast"); if(!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); } el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1800); }
const getPass = (...keys) => { try{ for(const k of [...keys,"rekil-pass"]){ const v = localStorage.getItem(k); if(v) return v; } }catch(_){} return ""; };
async function gas(url, body){ const r = await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)}); const j = await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j; }
async function getJSON(path){ const r = await fetch(path+"?v="+Date.now(), {cache:"no-store"}); return r.json(); }
function tabs(key, def, onChange){ let cur = ls.get(key, def); const set = () => { $$("[data-tab]").forEach(b=>b.classList.toggle("on", b.dataset.tab===cur)); $$("[data-view]").forEach(v=>v.hidden = v.dataset.view!==cur); onChange && onChange(cur); };
  document.addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if(!b) return; cur = b.dataset.tab; ls.set(key, cur); set(); }); set(); return () => cur; }
async function checkUpdate(){ try{ const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}); const t=await r.text(); const m=t.match(/const APP_VERSION = "([^"]+)"/); if(m && m[1]!==APP_VERSION) location.replace(location.pathname+"?v="+encodeURIComponent(m[1])); }catch(_){} }
if(location.protocol.startsWith("http")){ checkUpdate(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); }); }


let S = ls.get("auc-sched", {rules:[], soba:[]});
let hide = ls.get("auc-hide", []);
let fil = ls.get("auc-fil", "");
let sdone = ls.get("auc-soba", {});
const DAYS = 35;
function dates(r, from, n){
  const out = [];
  for(let i=0;i<n;i++){ const d = new Date(Date.parse(from+"T00:00:00Z") + i*864e5), dow = d.getUTCDay(), dd = d.getUTCDate(), nth = Math.ceil(dd/7);
    if((r.w && r.w.includes(dow)) || (r.d && r.d.includes(dd)) || (r.n && r.n.some(([k,w])=>k===nth && w===dow))) out.push(d.toISOString().slice(0,10)); }
  return out;
}
const shift = (d, n) => new Date(Date.parse(d+"T00:00:00Z") + n*864e5).toISOString().slice(0,10);
/* from〜to（toは含まない）の開催・下見開始。省略時は今日から35日 */
function events(from, to){
  const t = today(); from = from || t; to = to || shift(t,DAYS); const ev = [];
  const n = Math.round((Date.parse(to)-Date.parse(from))/864e5);
  S.rules.forEach(r=>{ if(r.manual || hide.includes(r.a)) return;
    dates(r, shift(from,-7), n+60).forEach(d=>{ if(d>=from && d<to) ev.push({d, k:"開催", r}); if(r.pre!=null){ const p = shift(d,-r.pre); if(p>=from && p<to) ev.push({d:p, k:"下見開始", r, of:d}); } }); });
  return ev.sort((a,b)=>a.d.localeCompare(b.d) || (a.k==="開催"?-1:1));
}
/* 表示する月（前後どの月でも見られる） */
let calYM = today().slice(0,7);
const ymAdd = (ym, n) => { const [y,m] = ym.split("-").map(Number), d = new Date(Date.UTC(y, m-1+n, 1)); return d.toISOString().slice(0,7); };
function renderCal(){
  const names = [...new Set(S.rules.map(r=>r.a))].filter(a=>!hide.includes(a));
  if(fil && !names.includes(fil)) fil = "";
  $("#fil").innerHTML = [`<option value="">すべての業者</option>`, ...names.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`)].join(""); $("#fil").value = fil;
  const t = today(), thisYM = t.slice(0,7);
  const opts = []; for(let i=-24;i<=24;i++){ const ym = ymAdd(thisYM, i); opts.push(`<option value="${ym}">${ym.slice(0,4)}年${+ym.slice(5)}月${ym===thisYM?"（今月）":""}</option>`); }
  $("#ym").innerHTML = opts.join(""); if(!opts.some(o=>o.includes(`"${calYM}"`))) calYM = thisYM; $("#ym").value = calYM;
  $("#ymNow").hidden = calYM===thisYM;
  const first = calYM+"-01", next = ymAdd(calYM,1)+"-01";
  const ev = events(first, next).filter(e=>!fil || e.r.a===fil), by = {};
  ev.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  /* 小さなカレンダー：日付を押すとその日の詳細へ移動 */
  let mc = ["日","月","火","水","木","金","土"].map(w=>`<span class="wh">${w}</span>`).join("");
  mc += "<span></span>".repeat(new Date(first+"T00:00:00Z").getUTCDay());
  for(let d = first; d < next; d = shift(d,1)){
    const es = by[d]||[];
    mc += `<button type="button" data-jump="${d}" class="${d===t?"td":""}${d<t?" past":""}" ${!es.length?"disabled":""}>${+d.slice(8)}<span class="dots">${es.slice(0,4).map(e=>`<i class="${e.k==="開催"?"":"p"}"></i>`).join("")}</span></button>`;
  }
  $("#mcal").innerHTML = mc;
  $("#cal").innerHTML = Object.keys(by).map(d=>`<div class="card${d<t?" pastc":""}" id="d-${d}"><h2>${md(d)}${d===t?" 今日":""}</h2>${by[d].map(e=>`<div class="row"><span class="tag ${e.k==="開催"?"a":""}">${e.k}</span><span class="t"><b>${esc(e.r.a)}</b><small>${esc(e.r.g)}${e.of?`（${md(e.of)}開催分）`:""}${e.k==="開催"&&e.r.memo?" ・"+esc(e.r.memo):""}</small></span></div>`).join("")}</div>`).join("") || '<div class="empty">この月の予定はありません</div>';
  const man = S.rules.filter(r=>r.manual && !hide.includes(r.a));
  $("#note").innerHTML = (calYM!==thisYM ? "今月以外は、今の開催ルール（曜日・日にち）から計算した予定です。臨時休みや日程変更は反映されません。<br>" : "") + (man.length ? man.map(r=>`${esc(r.a)}：${esc(r.memo)}`).join("<br>")+"<br>" : "") + esc(S.note||"");
}
function renderSoon(){
  const t = today(), e7 = events().filter(e=>e.k==="下見開始" || e.k==="開催").filter(e=>e.d<=shift(t,7));
  const open = {}; S.rules.forEach(r=>{ if(r.manual||hide.includes(r.a)||r.pre==null) return; dates(r,t,10).forEach(d=>{ if(shift(d,-r.pre)<=t) (open[d]=open[d]||[]).push(r); }); });
  $("#soon").innerHTML = Object.keys(open).sort().map(d=>`<div class="card"><h2>${md(d)} 開催（下見中）</h2>${open[d].map(r=>`<div class="row"><span class="t"><b>${esc(r.a)}</b><small>${esc(r.g)}</small></span></div>`).join("")}</div>`).join("") || '<div class="empty">今は下見中のオークションはありません</div>';
}
async function loadShitami(){
  try{ const j = await gas("https://script.google.com/macros/s/AKfycbw7kz9QQt6CMQvwIC4IhtSekntc4xGCUAWuop6U7LO_3U6FMRo--X6wKI0F6hSx3n3Vng/exec", {action:"list", pass:getPass("rekil-shitami-pass")});
    const t = today(), its = ((j.data||{}).items||[]).filter(i=>!i.date || i.date>=t);
    const wait = its.filter(i=>i.status!=="bid"), bid = its.filter(i=>i.status==="bid");
    $("#st").innerHTML = `<div class="row"><span class="t"><b>指値の登録待ち</b></span><span class="tag ${wait.length?"r":""}">${wait.length}件</span></div><div class="row"><span class="t"><b>指値登録済（これから開催）</b></span><span class="tag g">${bid.length}件</span></div>`
      + wait.slice(0,10).map(i=>`<div class="row"><span class="t"><b>${esc(i.auction)}</b><small>${i.date?md(i.date)+"開催":""} ${esc(i.memo||"")}</small></span><span class="tag">下見済</span></div>`).join("");
  }catch(e){ $("#st").innerHTML = `<span class="muted">${e.message==="passcode"?"暗証番号が未設定です。ReKiLホームで社内の暗証番号を入れてください。":"読み込めませんでした（電波を確認してください）"}</span>`; }
}
function renderSoba(){
  const t = today();
  $("#soba").innerHTML = S.soba.map(s=>{ const rs = S.rules.filter(r=>r.a===s.a && !r.manual); let last = "";
      rs.forEach(r=>dates(r, shift(t,-14), 15).forEach(d=>{ if(d<t && d>last) last = d; }));
      const key = s.a+"@"+last, done = !!sdone[key];
      return `<label class="row" style="cursor:pointer"><input type="checkbox" style="width:22px;min-height:22px;accent-color:var(--accent)" data-sk="${esc(key)}" ${done?"checked":""} ${last?"":"disabled"}><span class="t"><b style="${done?"opacity:.5;text-decoration:line-through":""}">${esc(s.a)}</b><small>${esc(s.t)}${last?` ・直近 ${md(last)}開催分`:""}</small></span>${!done&&last?'<span class="tag r">未</span>':""}</label>`; }).join("");
}
function renderSet(){ const names = [...new Set(S.rules.map(r=>r.a))]; $("#setList").innerHTML = names.map(a=>`<label class="row"><input type="checkbox" style="width:22px;min-height:22px" data-h="${esc(a)}" ${hide.includes(a)?"":"checked"}><span class="t"><b>${esc(a)}</b></span></label>`).join(""); }
document.addEventListener("click", e=>{
  if(e.target.id==="toTop"){ const m = document.querySelector("main"); m.scrollTo({top:0, behavior:"smooth"}); return; }
  if(e.target.id==="ymPrev"){ calYM = ymAdd(calYM,-1); renderCal(); return; }
  if(e.target.id==="ymNext"){ calYM = ymAdd(calYM,1); renderCal(); return; }
  if(e.target.id==="ymNow"){ calYM = today().slice(0,7); renderCal(); return; }
  const j = e.target.closest("[data-jump]"); if(j){ const c = document.getElementById("d-"+j.dataset.jump); if(c){ c.scrollIntoView({behavior:"smooth", block:"start"}); c.classList.add("flash"); setTimeout(()=>c.classList.remove("flash"), 1500); } return; }
  if(e.target.id==="setBtn"){ renderSet(); $("#set").hidden = false; }
  if(e.target.id==="setOk" || e.target.id==="set"){ $("#set").hidden = true; all(); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="fil"){ fil = e.target.value; ls.set("auc-fil", fil); renderCal(); return; }
  if(e.target.id==="ym"){ calYM = e.target.value; renderCal(); return; }
  const h = e.target.closest("[data-h]"); if(h){ hide = h.checked ? hide.filter(x=>x!==h.dataset.h) : [...hide, h.dataset.h]; ls.set("auc-hide", hide); if(fil===h.dataset.h){ fil=""; ls.set("auc-fil",""); } }
  const s = e.target.closest("[data-sk]"); if(s){ if(s.checked) sdone[s.dataset.sk]=1; else delete sdone[s.dataset.sk]; ls.set("auc-soba", sdone); renderSoba(); }
});
/* カレンダーより下までスクロールしたら「カレンダーに戻る」を出す */
{ const m = document.querySelector("main"); const upd = () => { const cal = document.querySelector('[data-view="cal"]'), mc = $("#mcal"); $("#toTop").hidden = !cal || cal.hidden || !mc || m.scrollTop < mc.offsetTop + mc.offsetHeight; };
  m.addEventListener("scroll", upd, {passive:true}); document.addEventListener("click", ()=>setTimeout(upd, 50)); }
function all(){ renderCal(); renderSoon(); renderSoba(); }
tabs("auc-tab", "cal", v=>{ if(v==="shitami") loadShitami(); });
all();
getJSON("schedule.json").then(j=>{ if(j && j.rules){ S = j; ls.set("auc-sched", j); all(); } }).catch(()=>{});

</script>
<script>/* 共通：電波がなくても開ける・ホームへ戻るボタン */if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{});try{if(sessionStorage.getItem("rekil-from-home")&&!/\/home\/?$/.test(location.pathname)){const b=document.createElement("a");b.href="../home/";b.textContent="⌂";b.setAttribute("aria-label","ReKiLホームへ");b.style.cssText="position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;width:44px;height:44px;border-radius:22px;background:#2a313a;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 16px #0008;opacity:.9";document.body.appendChild(b)}}catch(_){}</script>
</body>
</html>
